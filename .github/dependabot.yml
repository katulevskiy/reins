version: 2
updates:
  # Workflows pin actions to version tags; this keeps those tags current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # New releases wait a week before an update is proposed (zizmor: dependabot-cooldown).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
