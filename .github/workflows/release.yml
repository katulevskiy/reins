name: Release
# Builds alongside CI on main; publication waits for successful CI on the exact commit. The version comes from the commits since the last
# vX.Y.Z tag (scripts/next-version.sh; CONTRIBUTING.md, "Releases"); the tag is created on the exact commit CI tested.
# Assets: the desktop app for Linux (static musl), macOS and Windows (a zip with reins.exe), the Reins app's
# installers (a .dmg, an .msi, an AppImage and its tarball), the server binary, the server image on GHCR,
# the signed Android APK, the Google Play bundle (reins-<version>-play.aab, also uploaded to a Play track; job `play`),
# the Linux distribution packages (.deb, .rpm), the update feed (reins-feed-<version>.tar.gz, scripts/release-feed.sh;
# the server mirrors it into reins2fa.com/releases, with the APT and RPM repositories), and SHA256SUMS. Android
# signing is required for every release. Archives and installers use a
# versioned name and under a fixed one (reins-desktop-<target>.tar.gz, Reins-macOS.dmg, ...) for "latest" links.
# After the release, the aur job updates the AUR package reins-bin (optional).

# Only main pushes and maintainer dispatches can build with release credentials.
# Public release/image tags are updated only after CI and all required builds pass.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Bump level (auto = from the commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      verify_only:
        description: Build assets without creating a release or updating version/latest tags (CI-tested branches)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ inputs.verify_only && format('release-verification-{0}', github.ref) || 'release' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      actions: read # the CI result of a manually released commit
      contents: read
      id-token: write # short-lived Infisical OIDC login
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous: ${{ steps.version.outputs.previous }}
      sha: ${{ steps.commit.outputs.sha }}
      build: ${{ steps.version.outputs.build }}
      build-time: ${{ steps.version.outputs.build-time }}
    steps:
      - name: Commit to release
        id: commit
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            [[ "$REF" == refs/heads/main || "$VERIFY_ONLY" == true ]] || { echo "::error::Releases are made from main, not $REF"; exit 1; }
            sha="$EVENT_SHA"
            args=()
            [[ "$VERIFY_ONLY" == true ]] || args+=(--event push)
            ci="$(gh run list --workflow ci.yml --commit "$sha" "${args[@]}" --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
            [[ "$ci" == success ]] || { echo "::error::CI has not passed on $sha (${ci:-no run})"; exit 1; }
          else
            sha="$EVENT_SHA"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unexpected commit '$sha'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Next version
        id: version
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          BUMP: ${{ inputs.bump }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          # A newer push to main has its own CI run, which releases it with these commits included.
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$tip" != "$SHA" && "$VERIFY_ONLY" != true ]]; then
            echo "::notice::$SHA is no longer the tip of main ($tip); the newer commit will be released"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$BUMP" == auto ]] && BUMP=""
          scripts/next-version.sh --rev "$SHA" ${BUMP:+--bump "$BUMP"} --describe | tee -a "$GITHUB_OUTPUT"
          version="$(scripts/next-version.sh --rev "$SHA" ${BUMP:+--bump "$BUMP"})"
          if [[ -z "$version" ]]; then
            echo "::notice::Nothing to release since the last tag (only [skip release] commits, or none)"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The build id the desktop app and the APK show: version, commit time (UTC) and commit.
          time="$(git log -1 --format=%ct "$SHA")"
          stamp="$(TZ=UTC git log -1 --date=format-local:%Y%m%d%H%M --format=%cd "$SHA")"
          {
            echo "release=true"
            echo "build=$version-$stamp-${SHA:0:8}"
            echo "build-time=$time"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing v$version from $SHA"
      - name: Fetch signing identity from Infisical
        if: steps.version.outputs.release == 'true' && vars.INFISICAL_RELEASE_IDENTITY_ID != ''
        uses: ./.github/actions/release-secrets # zizmor: ignore[self-repository] use the exact release checkout
        with:
          identity-id: ${{ vars.INFISICAL_RELEASE_IDENTITY_ID }}
          environment: ${{ vars.INFISICAL_RELEASE_ENVIRONMENT || 'prod' }}
          secret-path: ${{ vars.INFISICAL_ANDROID_SIGNING_PATH || '/signing/android' }}
      - name: Require Android signing secrets
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="${KEYSTORE:-${ANDROID_KEYSTORE_BASE64:-}}"
          KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD:-${ANDROID_KEYSTORE_PASSWORD:-}}"
          KEY_ALIAS="${KEY_ALIAS:-${ANDROID_KEY_ALIAS:-}}"
          KEY_PASSWORD="${KEY_PASSWORD:-${ANDROID_KEY_PASSWORD:-}}"
          if [[ -z "$KEYSTORE" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Android signing is required. Configure INFISICAL_RELEASE_IDENTITY_ID or the four ANDROID_KEYSTORE/KEY secrets described in CONTRIBUTING.md."
            exit 1
          fi

  desktop:
    name: Desktop (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    # Windows on Arm is built on the x64 runner (ring needs clang for it, which the runner has) and cannot be run there;
    # a failure leaves that one archive out of the release instead of holding the release back.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      # A failed upload must not cancel independent builds needed by a release retry.
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, zig: true, native: true, optional: false }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04, zig: true, native: false, optional: false }
          # Standalone macOS CLI supports macOS 11; the GUI bundle requires macOS 12.
          - { target: aarch64-apple-darwin, os: macos-15, zig: false, native: true, optional: false }
          - { target: x86_64-apple-darwin, os: macos-15, zig: false, native: false, optional: false }
          - { target: aarch64-pc-windows-msvc, os: windows-2025, zig: false, native: false, optional: true }
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.plan.outputs.version }}
      REINS_BUILD: ${{ needs.plan.outputs.build }}
      REINS_BUILD_TIME: ${{ needs.plan.outputs.build-time }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      # Git on the Windows runners checks text files out with CRLF; the scripts below expect the files as committed.
      - name: Check out without CRLF
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustc -vV
      # The static Linux builds link with zig, as scripts/release-desktop.sh does.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-desktop-${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet cargo-zigbuild==0.23.4 ziglang==0.16.0
      # Tags are the source of truth; the binary reports the release version.
      - name: Set the version
        run: scripts/set-desktop-version.sh "$VERSION"
      - name: Build
        run: |
          if [[ "$TARGET" == *-linux-musl ]]; then
            PATH="$RUNNER_TEMP/zig/bin:$PATH" cargo zigbuild --release --locked -p reins-desktop --bin reins --target "$TARGET"
          else
            # Windows: the C runtime linked in, so reins.exe needs no Visual C++ Redistributable. With --target,
            # RUSTFLAGS reach only the program, not build scripts.
            [[ "$TARGET" == *-windows-msvc ]] && export RUSTFLAGS="-C target-feature=+crt-static"
            cargo build --release --locked -p reins-desktop --bin reins --target "$TARGET"
          fi
      - name: Smoke test
        if: matrix.native
        run: |
          exe="target/$TARGET/release/reins"
          [[ "$TARGET" == *-windows-* ]] && exe="$exe.exe"
          out="$("$exe" --version)"
          echo "$out"
          [[ "$out" == *"$VERSION ($REINS_BUILD)"* ]] || { echo "::error::unexpected version: $out"; exit 1; }
      # A tar.gz with reins on Linux and macOS, a zip with reins.exe on Windows (what Windows opens, and what
      # scripts/install.ps1 unpacks); the same layout inside.
      - name: Package
        run: scripts/package-cli.sh "$TARGET" "$VERSION"
      - uses: ./.github/actions/upload-artifact # zizmor: ignore[self-repository] use the exact release checkout
        with:
          name: dist-desktop-${{ matrix.target }}
          compression-level: 0
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 7

  # The Reins desktop app (crates/reins-desktop-app, GPUI) with reins inside, as installers: Reins-macOS.dmg
  # (universal), Reins-Windows-x64.msi (per user, WiX v4), Reins-Linux-x86_64.AppImage and its plain tarball, each also
  # under a versioned name. scripts/package/ builds them; the names without a version are what the website's
  # /download/<platform> links point at (releases/latest/download/<name>).
  #
  # macOS signing and notarization, all optional (without them the app is signed ad hoc and Gatekeeper asks once), read
  # from Infisical reins-release prod /signing/apple, else from the repository secrets of the same names:
  #   MACOS_CERT_P12, MACOS_CERT_PASSWORD   the "Developer ID Application" certificate and key (.p12, base64)
  #   AC_API_KEY_P8, AC_API_KEY_ID, AC_API_ISSUER_ID   an App Store Connect API key for notarytool
  # Windows signing, optional: WINDOWS_CERT_PFX (base64) and WINDOWS_CERT_PASSWORD.
  desktop-app:
    name: Desktop app (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Windows-x64, os: windows-2025 }
          # The oldest supported Ubuntu: the AppImage needs this glibc or newer.
          - { platform: Linux-x86_64, os: ubuntu-22.04 }
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REINS_BUILD: ${{ needs.plan.outputs.build }}
      REINS_BUILD_TIME: ${{ needs.plan.outputs.build-time }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Check out without CRLF
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          [[ "$RUNNER_OS" == macOS ]] && rustup target add aarch64-apple-darwin x86_64-apple-darwin
          [[ "$RUNNER_OS" == Windows ]] && rustup target add x86_64-pc-windows-msvc
          [[ "$RUNNER_OS" == Linux ]] && rustup target add x86_64-unknown-linux-gnu
          rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-desktop-app-${{ runner.os }}

      - name: GPUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev \
            libx11-xcb-dev libfontconfig1-dev libfreetype-dev libvulkan-dev pkg-config
      - name: Set the version
        run: scripts/set-desktop-version.sh "$VERSION"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # The C runtime linked in: no Visual C++ Redistributable needed.
          RUSTFLAGS: -C target-feature=+crt-static
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          REINS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERT_PFX) {
            $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
            $env:REINS_WINDOWS_CERT = $pfx
          }
          ./scripts/package/windows.ps1 -Version $env:VERSION
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: scripts/package/linux.sh
      - name: Collect
        run: |
          mkdir -p dist
          cp target/package/Reins-*.dmg target/package/Reins-*.msi target/package/Reins-*.AppImage \
            target/package/Reins-*.tar.gz dist/ 2>/dev/null || true
          ls -l dist
          [[ -n "$(ls dist)" ]] || { echo "::error::no installer was made"; exit 1; }
      # Windows CLI archives reuse the exact binary already built for the installer.
      # Keep macOS CLI jobs separate to preserve their older deployment target.
      - name: CLI archive from Windows installer binary
        if: runner.os == 'Windows'
        run: |
          target=x86_64-pc-windows-msvc
          out="$("target/$target/release-app/reins.exe" --version)"
          echo "$out"
          [[ "$out" == *"$VERSION ($REINS_BUILD)"* ]] || { echo "::error::unexpected CLI version: $out"; exit 1; }
          scripts/package-cli.sh "$target" "$VERSION" release-app
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.pfx"
      - uses: ./.github/actions/upload-artifact # zizmor: ignore[self-repository] use the exact release checkout
        with:
          name: dist-app-${{ matrix.platform }}
          compression-level: 0
          path: dist/*
          retention-days: 7

  # Compile the two macOS architectures on native runners; only bundling/signing is serial.
  macos-app-native:
    name: macOS app binaries (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, os: macos-15, cache: release-desktop-app-native-macOS }
          - { arch: x86_64, os: macos-15-intel, cache: release-desktop-app-macOS }
    env:
      TARGET: ${{ matrix.arch }}-apple-darwin
      VERSION: ${{ needs.plan.outputs.version }}
      REINS_BUILD: ${{ needs.plan.outputs.build }}
      REINS_BUILD_TIME: ${{ needs.plan.outputs.build-time }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          # Start a native-only Arm cache: the old immutable universal cache also stores Intel/fat artifacts.
          # The Intel worker's existing cache already contains only its native target.
          shared-key: ${{ matrix.cache }}
      - name: Remove obsolete macOS cache outputs
        run: |
          # This worker builds one native target with release-app. The old universal job cached both
          # architectures and the fat release profile; retaining them evicts useful Rust/Gradle caches.
          rm -rf target/release target/debug target/{aarch64,x86_64}-apple-darwin/release
          for cached_target in aarch64-apple-darwin x86_64-apple-darwin; do
            [[ "$cached_target" == "$TARGET" ]] || rm -rf "target/$cached_target"
          done
      - name: Set the version
        run: scripts/set-desktop-version.sh "$VERSION"
      - name: Build the app and bundled CLI
        run: cargo build --locked --profile release-app -p reins-desktop-app -p reins-desktop --bin reins-app --bin reins --target "$TARGET"
      - name: Smoke test the bundled CLI
        run: |
          out="$("target/$TARGET/release-app/reins" --version)"
          echo "$out"
          [[ "$out" == *"$VERSION ($REINS_BUILD)"* ]] || { echo "::error::unexpected CLI version: $out"; exit 1; }
      - uses: ./.github/actions/upload-artifact # zizmor: ignore[self-repository] use the exact release checkout
        with:
          name: macos-app-${{ matrix.arch }}
          compression-level: 0
          path: |
            target/${{ env.TARGET }}/release-app/reins-app
            target/${{ env.TARGET }}/release-app/reins
          retention-days: 1

  desktop-app-macos:
    name: Desktop app (macOS universal)
    needs: [plan, macos-app-native]
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-15
    timeout-minutes: 75 # notarization (twice: the app, then the disk image) can take long, the first ones especially
    permissions:
      contents: read
      id-token: write # Infisical OIDC (the Developer ID identity and notary key)
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REINS_BUILD: ${{ needs.plan.outputs.build }}
      REINS_BUILD_TIME: ${{ needs.plan.outputs.build-time }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: macos-app-aarch64
          path: target/aarch64-apple-darwin/release-app
      - uses: actions/download-artifact@v8
        with:
          name: macos-app-x86_64
          path: target/x86_64-apple-darwin/release-app
      - name: Restore executable permissions and set the version
        run: |
          chmod +x target/{aarch64,x86_64}-apple-darwin/release-app/{reins,reins-app}
          scripts/set-desktop-version.sh "$VERSION"
      # Written to a file (not exported to later steps), read by the next step only, and removed afterwards.
      - name: Fetch the Apple signing identity from Infisical
        if: vars.INFISICAL_RELEASE_IDENTITY_ID != ''
        uses: ./.github/actions/release-secrets # zizmor: ignore[self-repository] use the exact release checkout
        with:
          identity-id: ${{ vars.INFISICAL_RELEASE_IDENTITY_ID }}
          environment: ${{ vars.INFISICAL_RELEASE_ENVIRONMENT || 'prod' }}
          secret-path: /signing/apple
          export-type: file
          file-output-path: /.apple-signing.env
      - name: Package (macOS)
        # Signing set up and used in one step: the identity and notary key never pass through GITHUB_ENV.
        env:
          ARCHS: aarch64 x86_64
          REINS_SKIP_BUILD: "1"
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          # Infisical (/signing/apple) first; the repository secrets of the same names are the fallback.
          apple_env="$GITHUB_WORKSPACE/.apple-signing.env"
          if [[ -s "$apple_env" ]]; then
            eval "$(python3 - "$apple_env" <<'PY'
          import re, shlex, sys
          text = open(sys.argv[1]).read()
          names = {"MACOS_CERT_P12", "MACOS_CERT_PASSWORD", "AC_API_KEY_P8", "AC_API_KEY_ID", "AC_API_ISSUER_ID"}
          for key, value in re.findall(r"^([A-Z0-9_]+)='(.*?)'$", text, re.M | re.S):
              if key in names and value:
                  for line in value.splitlines():
                      if line.strip():
                          print(f"echo {shlex.quote('::add-mask::' + line)}")
                  print(f"{key}={shlex.quote(value)}")
          PY
          )"
            rm -f "$apple_env"
          fi
          if [[ -z "$MACOS_CERT_P12" ]]; then
            echo "::notice::macOS app not signed with a Developer ID: MACOS_CERT_P12 is not configured"
          else
            keychain="$RUNNER_TEMP/release.keychain-db"
            pass="$(openssl rand -hex 16)"
            security create-keychain -p "$pass" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$pass" "$keychain"
            base64 -d <<<"$MACOS_CERT_P12" > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" login.keychain-db
            REINS_DEVELOPER_ID="$(security find-identity -v -p codesigning "$keychain" |
              sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
            [[ -n "$REINS_DEVELOPER_ID" ]] || { echo "::error::the .p12 holds no Developer ID Application identity"; exit 1; }
            export REINS_DEVELOPER_ID
            if [[ -n "$AC_API_KEY_P8" && -n "$AC_API_KEY_ID" && -n "$AC_API_ISSUER_ID" ]]; then
              printf '%s' "$AC_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
              export REINS_NOTARY_KEY="$RUNNER_TEMP/notary.p8" REINS_NOTARY_KEY_ID="$AC_API_KEY_ID" \
                REINS_NOTARY_ISSUER="$AC_API_ISSUER_ID"
            fi
          fi
          scripts/package/macos.sh
      - name: Verify universal executables
        run: |
          for binary in reins reins-app; do
            archs="$(lipo -archs "target/package/Reins.app/Contents/MacOS/$binary")"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::Missing app architecture: $archs"; exit 1; }
            test -x "target/package/Reins.app/Contents/MacOS/$binary"
          done
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/notary.p8" "$GITHUB_WORKSPACE/.apple-signing.env"
      - uses: ./.github/actions/upload-artifact # zizmor: ignore[self-repository] use the exact release checkout
        with:
          name: dist-app-macOS
          compression-level: 0
          path: target/package/Reins-*.dmg
          retention-days: 7

  server:
    name: Server binary (x86_64-unknown-linux-gnu)
    needs: plan
    if: needs.plan.outputs.release == 'true'
    # The oldest supported Ubuntu: the binary needs this glibc or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc -vV
      # SQLite is bundled; OpenSSL is vendored so the binary does not depend on the system's libssl.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-server-${{ runner.os }}

      - name: Build
        env:
          VW_VERSION: ${{ needs.plan.outputs.version }}
        run: cargo build --release --locked --features sqlite,vendored_openssl --bin vaultwarden --target "$TARGET"
      - name: Smoke test
        run: |
          out="$("target/$TARGET/release/vaultwarden" --version)"
          echo "$out"
          [[ "$out" == *"$VERSION"* ]] || { echo "::error::unexpected version: $out"; exit 1; }
      - name: Package
        run: |
          name="reins-server-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/vaultwarden" .env.template LICENSE LICENSE-AGPL LICENSING.md NOTICE README.md \
            "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/${name:?}"
          ls -l dist
      - uses: ./.github/actions/upload-artifact # zizmor: ignore[self-repository] use the exact release checkout
        with:
          name: dist-server
          compression-level: 0
          path: dist/*.tar.gz
          retention-days: 7

  docker:
    name: Server image (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/reins-server" >> "$GITHUB_OUTPUT"
      # Native runners give each architecture its own CPUs and avoid emulated apt-get.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: docker/Dockerfile.debian
          platforms: linux/${{ matrix.arch }}
          # Push immutable digests first; the publisher updates public version/latest tags together.
          outputs: ${{ inputs.verify_only && 'type=docker' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.image.outputs.name) }}
          tags: ${{ inputs.verify_only && format('reins-server-verify:{0}', matrix.arch) || '' }}
          # Docker layers were evicting Rust/Gradle caches from the repository's shared cache quota.
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ matrix.arch }},mode=max
          build-args: |
            VW_VERSION=${{ needs.plan.outputs.version }}
          labels: |
            org.opencontainers.image.title=Reins server
            org.opencontainers.image.description=The Reins server: Vaultwarden with the Reins permission relay for AI agents
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Smoke test the built image
        if: inputs.verify_only == true
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          out="$(docker run --rm --entrypoint /vaultwarden "reins-server-verify:$ARCH" --version)"
          echo "$out"
          [[ "$out" == *"$VERSION"* ]] || { echo "::error::unexpected image version: $out"; exit 1; }
      - name: Export image digest
        if: inputs.verify_only != true
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: ./.github/actions/upload-artifact # zizmor: ignore[self-repository] use the exact release checkout
        if: inputs.verify_only != true
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  android-native:
    name: Android native (${{ matrix.kind }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        kind: [arm64-v8a, x86_64, bindings]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # No prefix fallback: these libraries must match the exact native sources/configuration.
      # Version, build ID and signing only enter the later APK packaging job.
      - uses: actions/cache@v5
        id: native
        with:
          path: native
          key: android-native-v1-${{ runner.os }}-${{ matrix.kind }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'crates/reins-core/**', 'crates/reins-proto/**', 'crates/reins-policy/**', 'android/app/build.gradle.kts', 'scripts/build-android-native.sh', '.github/workflows/release.yml') }}
      - name: Install Rust toolchain and Android targets
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        if: steps.native.outputs.cache-hit != 'true'
        with:
          shared-key: release-android-native-${{ matrix.kind }}
      - uses: actions/cache@v5
        if: steps.native.outputs.cache-hit != 'true' && matrix.kind != 'bindings'
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-4.1.2
      - name: Install cargo-ndk and NDK
        if: steps.native.outputs.cache-hit != 'true' && matrix.kind != 'bindings'
        run: |
          cargo ndk --version || cargo install --locked cargo-ndk@4.1.2
          ndk="$(grep -oP 'reinsNdkVersion = "\K[^"]+' android/app/build.gradle.kts)"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ndk}" > /dev/null
      - name: Build native output
        if: steps.native.outputs.cache-hit != 'true'
        env:
          KIND: ${{ matrix.kind }}
        run: scripts/build-android-native.sh "$KIND" "$GITHUB_WORKSPACE/native"
      - uses: ./.github/actions/upload-artifact # zizmor: ignore[self-repository] use the exact release checkout
        with:
          name: android-native-${{ matrix.kind }}
          path: native/
          retention-days: 1

  android:
    name: Android APK (full) and bundle (play)
    needs: [plan, android-native]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # Infisical OIDC
    outputs:
      version-code: ${{ steps.build.outputs.version-code }} # for the Android updater's feed (publish)
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v8
        with:
          pattern: android-native-*
          merge-multiple: true
          path: native
      - name: Require native libraries and bindings
        run: |
          test -s native/jni/arm64-v8a/libreins_core.so
          test -s native/jni/x86_64/libreins_core.so
          test -s native/kotlin/dev/reins/core/reins_core.kt
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false # maintainer dispatches also warm the Gradle build cache
      - name: Fetch signing identity from Infisical
        if: vars.INFISICAL_RELEASE_IDENTITY_ID != ''
        uses: ./.github/actions/release-secrets # zizmor: ignore[self-repository] use the exact release checkout
        with:
          identity-id: ${{ vars.INFISICAL_RELEASE_IDENTITY_ID }}
          environment: ${{ vars.INFISICAL_RELEASE_ENVIRONMENT || 'prod' }}
          secret-path: ${{ vars.INFISICAL_ANDROID_SIGNING_PATH || '/signing/android' }}
      - name: Keystore and production certificate
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          KEYSTORE="${KEYSTORE:-${ANDROID_KEYSTORE_BASE64:-}}"
          [[ -n "$KEYSTORE" ]] || { echo "::error::Android signing keystore is missing"; exit 1; }
          base64 -d <<<"$KEYSTORE" > "$RUNNER_TEMP/release.keystore"
          export REINS_CI_STORE_PASSWORD="${KEYSTORE_PASSWORD:-${ANDROID_KEYSTORE_PASSWORD:-}}"
          alias="${KEY_ALIAS:-${ANDROID_KEY_ALIAS:-}}"
          keytool -exportcert -keystore "$RUNNER_TEMP/release.keystore" -alias "$alias" \
            -storepass:env REINS_CI_STORE_PASSWORD > "$RUNNER_TEMP/release-certificate.der"
          expected="$(cat android/release-signing.sha256)"
          actual="$(sha256sum "$RUNNER_TEMP/release-certificate.der" | cut -d' ' -f1)"
          [[ "$actual" == "$expected" ]] || { echo "::error::Keystore does not match production signing identity"; exit 1; }
      # android/app/build.gradle.kts signs fullRelease with the REINS_RELEASE_* key and the Play bundle (playRelease)
      # with the REINS_UPLOAD_* key: the same production key, which is the Play upload key (Google Play re-signs
      # with its app signing key). versionCode is the build time in minutes, as in scripts/release-android.sh, so every
      # release installs over the previous one; both builds share it.
      - name: Build the APK and the Play bundle
        id: build
        working-directory: android
        env:
          REINS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REINS_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REINS_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Telegram's application credentials (my.telegram.org) and the Firebase config (push). Without them the APK
          # still builds, but Telegram shows "needs setup" and approvals only arrive while the app is open.
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          export REINS_RELEASE_KEYSTORE_PASSWORD="${REINS_RELEASE_KEYSTORE_PASSWORD:-${ANDROID_KEYSTORE_PASSWORD:-}}"
          export REINS_RELEASE_KEY_ALIAS="${REINS_RELEASE_KEY_ALIAS:-${ANDROID_KEY_ALIAS:-}}"
          export REINS_RELEASE_KEY_PASSWORD="${REINS_RELEASE_KEY_PASSWORD:-${ANDROID_KEY_PASSWORD:-}}"
          export REINS_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          export REINS_UPLOAD_KEYSTORE="$RUNNER_TEMP/release.keystore"
          export REINS_UPLOAD_KEYSTORE_PASSWORD="$REINS_RELEASE_KEYSTORE_PASSWORD"
          export REINS_UPLOAD_KEY_ALIAS="$REINS_RELEASE_KEY_ALIAS"
          export REINS_UPLOAD_KEY_PASSWORD="$REINS_RELEASE_KEY_PASSWORD"
          version_code="$(($(date -u +%s) / 60))"
          echo "version-code=$version_code" >> "$GITHUB_OUTPUT"
          extra=()
          if [[ -n "${TELEGRAM_API_ID:-}" && -n "${TELEGRAM_API_HASH:-}" ]]; then
            extra+=("-Preins.telegramApiId=$TELEGRAM_API_ID" "-Preins.telegramApiHash=$TELEGRAM_API_HASH")
          else
            echo "::warning::TELEGRAM_API_ID / TELEGRAM_API_HASH are not set: this APK cannot connect Telegram."
          fi
          if [[ -n "${GOOGLE_SERVICES_JSON:-}" ]]; then
            (umask 077; printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json")
            rm -f app/google-services.json
            extra+=("-Preins.googleServicesJson=$RUNNER_TEMP/google-services.json")
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set: this APK gets no push notifications."
          fi
          # The site and the sign-in screen's server are gradle.properties' reins.site / reins.defaultServer. The
          # Play bundle uses the same Telegram credentials and Firebase config (same application id).
          ./gradlew --no-daemon --parallel --no-configuration-cache :app:assembleFullRelease :app:bundlePlayRelease \
            "-Preins.prebuiltNativeDir=$GITHUB_WORKSPACE/native" \
            -Preins.secureScreens=true \
            "-Preins.versionCode=$version_code" \
            "-Preins.versionName=$VERSION" \
            "-Preins.build=$BUILD" \
            "${extra[@]}"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/release-certificate.der" "$RUNNER_TEMP/google-services.json"
      - name: Verify and name the APK
        env:
          VERSION_CODE: ${{ steps.build.outputs.version-code }}
        run: |
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apk="dist/reins-$VERSION-android.apk"
          mkdir -p dist
          cp android/app/build/outputs/apk/full/release/app-full-release.apk "$apk"
          "$build_tools/apksigner" verify --print-certs "$apk" | tee certs.txt
          expected="$(cat android/release-signing.sha256)"
          actual="$(sed -n 's/.*certificate SHA-256 digest: //p' certs.txt | head -1)"
          [[ "$actual" == "$expected" ]] || { echo "::error::APK signing certificate changed; existing users cannot update"; exit 1; }
          python3 scripts/check-android-apk.py "$apk" --aapt2 "$build_tools/aapt2" \
            --version "$VERSION" --version-code "$VERSION_CODE"
          {
            echo "### APK signing certificate"
            echo '```'
            grep -E 'certificate SHA-(1|256) digest' certs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # bundletool validates the bundle and makes the universal APK the bundle checks run on (pinned by SHA-256).
      - name: Verify and name the Play bundle
        env:
          VERSION_CODE: ${{ steps.build.outputs.version-code }}
          BUNDLETOOL_VERSION: 1.18.3
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          aab="dist/reins-$VERSION-play.aab"
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab "$aab"
          # The upload certificate is the production key (android/release-signing.sha256); Google Play refuses
          # bundles signed by another key once the upload key is registered.
          python3 scripts/check-android-apk.py "$aab" --aapt2 "$build_tools/aapt2" \
            --version "$VERSION" --version-code "$VERSION_CODE" \
            --bundletool "$RUNNER_TEMP/bundletool.jar" --cert-sha256 "$(cat android/release-signing.sha256)"
          {
            echo "### Play bundle upload certificate"
            echo '```'
            keytool -printcert -jarfile "$aab" | grep -E 'SHA(1|256):'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/upload-artifact # zizmor: ignore[self-repository] use the exact release checkout
        with:
          name: dist-android
          compression-level: 0
          path: dist/*.apk
          retention-days: 7
      - uses: ./.github/actions/upload-artifact # zizmor: ignore[self-repository] use the exact release checkout
        with:
          name: dist-android-play
          compression-level: 0
          path: dist/*.aab
          retention-days: 7

  # The Linux distribution packages, made with nfpm from the files the archives and the AppImage carry
  # (scripts/package/linux-packages.sh): reins_<version>_{amd64,arm64}.deb and reins-<version>-1.{x86_64,aarch64}.rpm
  # (the command-line program), reins-app_<version>_amd64.deb and reins-app-<version>-1.x86_64.rpm (the desktop app).
  # Linted (lintian, rpmlint), the .rpm files signed, the signed APT and RPM repositories built
  # (scripts/package/linux-repos.sh), and installed from those repositories in Ubuntu, Debian and Fedora containers
  # (here amd64, arm64 in linux-packages-arm64). The update feed carries the repositories to
  # reins2fa.com/releases/packages/ (publish).
  #
  # The repository key (OpenPGP), from Infisical reins-release prod /signing/packages, else the repository secrets of the
  # same names: PACKAGES_GPG_PRIVATE_KEY (the armored secret key) and, if it has one, PACKAGES_GPG_PASSPHRASE. Its
  # public half, committed as scripts/package/linux-packages/packages-key.asc, switches the repositories on: until then
  # a throwaway key signs them for the tests only, the .rpm files are released unsigned and the feed has no
  # repositories. Once it is there, a missing or different secret key fails the release.
  linux-packages:
    name: Linux packages
    needs: [plan, desktop, desktop-app]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Infisical OIDC (the repository key)
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
      BUILD_TIME: ${{ needs.plan.outputs.build-time }}
      NFPM_VERSION: 2.47.0
      NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783 # nfpm_2.47.0_Linux_x86_64.tar.gz
      FEDORA: fedora:44
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-desktop-*-unknown-linux-musl
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: dist-app-Linux-x86_64
          path: dist
      - name: Packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lintian createrepo-c rpm apt-utils binutils-aarch64-linux-gnu
          curl -fsSL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          "$RUNNER_TEMP/nfpm" --version | tail -n +2
      - name: Build the packages
        run: |
          NFPM="$RUNNER_TEMP/nfpm" scripts/package/linux-packages.sh --version "$VERSION" --build "$BUILD" \
            --time "$BUILD_TIME" --dist dist --out packages
      - name: Lint the .deb packages (lintian)
        run: lintian --fail-on error --no-tag-display-limit packages/*.deb
      - name: Lint the .rpm packages (rpmlint)
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$FEDORA" sh -c \
            'dnf install -y -q rpmlint >/dev/null && rpmlint -c scripts/package/linux-packages/rpmlint.toml packages/*.rpm'
      # Written to a file (not exported to later steps), read by the next step only, and removed afterwards. A missing
      # folder is not an error here: the next step decides whether the key is required.
      - name: Fetch the repository key from Infisical
        if: vars.INFISICAL_RELEASE_IDENTITY_ID != ''
        continue-on-error: true
        uses: ./.github/actions/release-secrets # zizmor: ignore[self-repository] use the exact release checkout
        with:
          identity-id: ${{ vars.INFISICAL_RELEASE_IDENTITY_ID }}
          environment: ${{ vars.INFISICAL_RELEASE_ENVIRONMENT || 'prod' }}
          secret-path: /signing/packages
          export-type: file
          file-output-path: /.packages-key.env
      - name: Sign the packages and build the repositories
        env:
          PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
          PACKAGES_GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
        run: |
          umask 077
          key_env="$GITHUB_WORKSPACE/.packages-key.env"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$key_env" "$GNUPGHOME" "$RUNNER_TEMP/packages-passphrase"' EXIT
          # Infisical (/signing/packages) first; the repository secrets of the same names are the fallback.
          if [[ -s "$key_env" ]]; then
            eval "$(python3 - "$key_env" <<'PY'
          import re, shlex, sys
          text = open(sys.argv[1]).read()
          names = {"PACKAGES_GPG_PRIVATE_KEY", "PACKAGES_GPG_PASSPHRASE"}
          for key, value in re.findall(r"^([A-Z0-9_]+)='(.*?)'$", text, re.M | re.S):
              if key in names and value:
                  for line in value.splitlines():
                      if line.strip():
                          print(f"echo {shlex.quote('::add-mask::' + line)}")
                  print(f"{key}={shlex.quote(value)}")
          PY
          )"
            rm -f "$key_env"
          fi
          mkdir -p "$GNUPGHOME"
          pinned=scripts/package/linux-packages/packages-key.asc
          args=()
          if [[ -f "$pinned" ]]; then
            [[ -n "${PACKAGES_GPG_PRIVATE_KEY:-}" ]] ||
              { echo "::error::$pinned is pinned but PACKAGES_GPG_PRIVATE_KEY is missing (Infisical /signing/packages)"; exit 1; }
            printf '%s\n' "$PACKAGES_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
            if [[ -n "${PACKAGES_GPG_PASSPHRASE:-}" ]]; then
              printf '%s' "$PACKAGES_GPG_PASSPHRASE" > "$RUNNER_TEMP/packages-passphrase"
              args+=(--passphrase-file "$RUNNER_TEMP/packages-passphrase")
            fi
            public="$pinned"
          else
            echo "::warning::No repository key is pinned ($pinned): a throwaway key signs the repositories for the tests; the .rpm files are released unsigned and the update feed has no repositories."
            gpg --batch --quiet --pinentry-mode loopback --passphrase '' \
              --quick-gen-key "Reins packages, throwaway <support@reins2fa.com>" rsa3072 sign 1d
            gpg --batch --armor --export > "$RUNNER_TEMP/throwaway-key.asc"
            public="$RUNNER_TEMP/throwaway-key.asc"
          fi
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          scripts/package/linux-repos.sh --packages packages --out repo --key "$fingerprint" --public-key "$public" \
            "${args[@]}"
          # The release publishes the signed packages, the ones in the repository.
          [[ -f "$pinned" ]] && cp repo/packages/rpm/*/*.rpm packages/
          ls -l packages
      - name: Install from the repositories (amd64)
        run: scripts/package/test-linux-repos.sh --repo repo --version "$VERSION" --build "$BUILD"
      - uses: ./.github/actions/upload-artifact # zizmor: ignore[self-repository] use the exact release checkout
        with:
          name: dist-linux-packages
          compression-level: 0
          path: |
            packages/*.deb
            packages/*.rpm
          retention-days: 7
      # Not a release asset: the update feed's repositories (publish) and the arm64 test.
      - uses: ./.github/actions/upload-artifact # zizmor: ignore[self-repository] use the exact release checkout
        with:
          name: linux-package-repo
          compression-level: 0
          path: repo/
          retention-days: 1

  linux-packages-arm64:
    name: Linux packages (arm64 install test)
    needs: [plan, linux-packages]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: linux-package-repo
          path: repo
      - name: Install from the repositories (arm64)
        run: scripts/package/test-linux-repos.sh --repo repo --version "$VERSION" --build "$BUILD"

  publish:
    name: Publish the release
    needs: [plan, desktop, desktop-app, desktop-app-macos, server, docker, android, linux-packages, linux-packages-arm64]
    if: >-
      always() && needs.plan.outputs.release == 'true' &&
      needs.desktop.result == 'success' && needs.desktop-app.result == 'success' &&
      needs.desktop-app-macos.result == 'success' &&
      needs.server.result == 'success' && needs.docker.result == 'success' &&
      needs.android.result == 'success' &&
      needs.linux-packages.result == 'success' && needs.linux-packages-arm64.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read # exact-commit CI publication gate
      packages: write # publish the completed multi-architecture image
      id-token: write # Infisical OIDC (the release key that signs the update feed)
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Require successful CI on the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          if [[ "$VERIFY_ONLY" == true ]]; then
            echo 'Verification branch CI was checked in plan; public publishing is disabled.'
          else
            scripts/wait-for-ci.sh "$SHA"
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: linux-package-repo
          path: packages-repo
      # The release key is written to a file (not exported to later steps) and removed right after signing.
      - name: Fetch the release key from Infisical
        if: vars.INFISICAL_RELEASE_IDENTITY_ID != ''
        uses: ./.github/actions/release-secrets # zizmor: ignore[self-repository] use the exact release checkout
        with:
          identity-id: ${{ vars.INFISICAL_RELEASE_IDENTITY_ID }}
          environment: ${{ vars.INFISICAL_RELEASE_ENVIRONMENT || 'prod' }}
          secret-path: /signing/release
          export-type: file
          file-output-path: /.release-key.env
      # reins-feed-<version>.tar.gz: the signed update manifests, the installers and the Android feed, which the
      # server's reins-releases-sync mirrors into reins2fa.com/releases (scripts/release-feed.sh), and the APT and RPM
      # repositories once their key is pinned (linux-packages).
      - name: Update feed
        env:
          BUILD: ${{ needs.plan.outputs.build }}
          BUILD_TIME: ${{ needs.plan.outputs.build-time }}
          VERSION_CODE: ${{ needs.android.outputs.version-code }}
        run: |
          umask 077
          key_env="$GITHUB_WORKSPACE/.release-key.env"
          trap 'rm -f "$key_env" "$RUNNER_TEMP/release-signing.pk8"' EXIT
          [[ -s "$key_env" ]] || { echo "::error::The release key is missing (Infisical /signing/release)"; exit 1; }
          key_b64="$(sed -n "s/^RELEASE_SIGNING_KEY_BASE64='\(.*\)'$/\1/p" "$key_env")"
          [[ -n "$key_b64" ]] || { echo "::error::RELEASE_SIGNING_KEY_BASE64 is missing"; exit 1; }
          echo "::add-mask::$key_b64" # file exports are not masked by the Infisical action
          base64 -d <<<"$key_b64" > "$RUNNER_TEMP/release-signing.pk8"
          packages=()
          [[ -f scripts/package/linux-packages/packages-key.asc ]] && packages=(--packages packages-repo)
          scripts/release-feed.sh --version "$VERSION" --build "$BUILD" --time "$BUILD_TIME" \
            --android-version-code "$VERSION_CODE" --dist dist --key "$RUNNER_TEMP/release-signing.pk8" "${packages[@]}"
      - name: Checksums
        working-directory: dist
        run: |
          [[ -s "reins-$VERSION-android.apk" ]] || { echo "::error::Android APK is missing from release assets"; exit 1; }
          [[ -s "reins-$VERSION-play.aab" ]] || { echo "::error::Play bundle is missing from release assets"; exit 1; }
          for package in "reins_${VERSION}_amd64.deb" "reins_${VERSION}_arm64.deb" "reins-app_${VERSION}_amd64.deb" \
            "reins-$VERSION-1.x86_64.rpm" "reins-$VERSION-1.aarch64.rpm" "reins-app-$VERSION-1.x86_64.rpm"; do
            [[ -s "$package" ]] || { echo "::error::$package is missing from release assets"; exit 1; }
          done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: docker/setup-buildx-action@v4
        if: inputs.verify_only != true
      - uses: docker/login-action@v4
        if: inputs.verify_only != true
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        if: inputs.verify_only != true
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests
      - name: Publish multi-architecture manifest
        if: inputs.verify_only != true
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          image="ghcr.io/${OWNER,,}/reins-server"
          refs=()
          for digest in digests/*; do refs+=("$image@sha256:${digest##*/}"); done
          [[ "${#refs[@]}" == 2 ]] || { echo "::error::Missing image architecture"; exit 1; }
          docker buildx imagetools create --tag "$image:$VERSION" --tag "$image:latest" "${refs[@]}"
          docker buildx imagetools inspect "$image:$VERSION"
      - name: Verification complete
        if: inputs.verify_only == true
        run: echo 'Both native server images built successfully; publishing disabled.'

      - name: Release notes
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          scripts/release-notes.sh --version "$VERSION" --previous "$PREVIOUS" --rev "$SHA" \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --image "ghcr.io/${OWNER,,}/reins-server" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create the release
        if: inputs.verify_only != true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Upload everything before making this release visible to latest/download clients.
          gh release create "$TAG" dist/* --target "$SHA" --title "Reins $TAG" --notes-file notes.md --draft
          gh release edit "$TAG" --draft=false --latest
          echo "::notice::Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"

  # The published release's Play bundle goes to a Google Play track (internal testing unless the repository variable
  # PLAY_TRACK says alpha, beta or production) with scripts/play-upload.py. Skipped while no service account is
  # configured (Infisical /signing/play, PLAY_SERVICE_ACCOUNT_JSON); see android/PLAY_STORE.md.
  play:
    name: Google Play upload
    needs: [plan, android, publish]
    if: >-
      always() && needs.plan.outputs.release == 'true' && needs.publish.result == 'success' &&
      inputs.verify_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # Google processes the bundle before it answers
    permissions:
      contents: read
      id-token: write # Infisical OIDC (the Play service account)
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist-android-play
          path: dist
      # Written to a file (not exported to later steps), read by the next step only, and removed afterwards. The folder
      # may not exist yet: then the upload is skipped.
      - name: Fetch the Play service account from Infisical
        if: vars.INFISICAL_RELEASE_IDENTITY_ID != ''
        continue-on-error: true
        uses: ./.github/actions/release-secrets # zizmor: ignore[self-repository] use the exact release checkout
        with:
          identity-id: ${{ vars.INFISICAL_RELEASE_IDENTITY_ID }}
          environment: ${{ vars.INFISICAL_RELEASE_ENVIRONMENT || 'prod' }}
          secret-path: ${{ vars.INFISICAL_PLAY_PATH || '/signing/play' }}
          export-type: file
          file-output-path: /.play.env
      - name: Upload to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          VERSION_CODE: ${{ needs.android.outputs.version-code }}
        run: |
          umask 077
          play_env="$GITHUB_WORKSPACE/.play.env"
          credentials="$RUNNER_TEMP/play-service-account.json"
          trap 'rm -f "$play_env" "$credentials"' EXIT
          # Infisical (/signing/play) first; the repository secret of the same name is the fallback.
          if [[ -s "$play_env" ]]; then
            eval "$(python3 - "$play_env" <<'PY'
          import re, shlex, sys
          text = open(sys.argv[1]).read()
          for key, value in re.findall(r"^([A-Z0-9_]+)='(.*?)'$", text, re.M | re.S):
              if key == "PLAY_SERVICE_ACCOUNT_JSON" and value:
                  print(f"PLAY_SERVICE_ACCOUNT_JSON={shlex.quote(value)}")
          PY
          )"
          fi
          if [[ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::notice::Not uploaded to Google Play: PLAY_SERVICE_ACCOUNT_JSON is not configured (Infisical /signing/play)"
            exit 0
          fi
          # Mask the key's parts too: file exports are not masked by the Infisical action.
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$credentials"
          python3 - "$credentials" <<'PY'
          import json, sys
          account = json.load(open(sys.argv[1]))
          for name in ("private_key", "private_key_id"):
              for line in str(account.get(name, "")).splitlines():
                  if line.strip() and "PRIVATE KEY-----" not in line:
                      print(f"::add-mask::{line.strip()}")
          PY
          unset PLAY_SERVICE_ACCOUNT_JSON
          status=0
          python3 scripts/play-upload.py --credentials "$credentials" \
            --bundle "dist/reins-$VERSION-play.aab" --version "$VERSION" --version-code "$VERSION_CODE" \
            --track "$PLAY_TRACK" --status "$PLAY_RELEASE_STATUS" \
            --notes-dir android/play/release-notes || status=$?
          if [[ "$status" == 3 ]]; then
            echo "::error::The app is still a draft on Google Play: set the repository variable PLAY_RELEASE_STATUS to draft until the first release is rolled out (android/PLAY_STORE.md, First upload)"
          elif [[ "$status" != 0 ]]; then
            echo "::error::Google Play upload failed (the GitHub release is published; rerun this job after fixing it)"
          else
            echo "::notice::v$VERSION ($VERSION_CODE) is on the Google Play $PLAY_TRACK track ($PLAY_RELEASE_STATUS)"
          fi
          exit "$status"
      - name: Remove the Play credentials
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.play.env" "$RUNNER_TEMP/play-service-account.json"

  # reins-bin on the AUR (https://aur.archlinux.org/packages/reins-bin): its PKGBUILD and .SRCINFO, written from the
  # published release's SHA256SUMS (scripts/package/aur.sh) and checked with makepkg in an Arch Linux container
  # (.SRCINFO as makepkg prints it; the sources download and match), then pushed over SSH. Optional: it runs after the
  # release is public, and without the key (Infisical reins-release prod /signing/aur: AUR_SSH_PRIVATE_KEY, the
  # OpenSSH private key of the AUR account that maintains reins-bin; else the repository secret of that name) it only
  # says so. A failure here does not undo or block anything.
  aur:
    name: AUR (reins-bin)
    needs: [plan, publish]
    if: needs.publish.result == 'success' && inputs.verify_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Infisical OIDC (the AUR key)
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: PKGBUILD and .SRCINFO
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          scripts/package/aur.sh --version "$VERSION" --sums "$RUNNER_TEMP/SHA256SUMS" --out aur
          cat aur/PKGBUILD
      - name: Check with makepkg
        run: |
          docker run --rm -v "$PWD/aur:/aur:ro" archlinux:base-devel bash -euo pipefail -c '
            useradd -m builder
            cp -r /aur /home/builder/aur
            chown -R builder /home/builder/aur
            cd /home/builder/aur
            su builder -c "makepkg --printsrcinfo" | diff -u .SRCINFO -
            su builder -c "makepkg --verifysource --noconfirm"'
      - name: Fetch the AUR key from Infisical
        if: vars.INFISICAL_RELEASE_IDENTITY_ID != ''
        continue-on-error: true
        uses: ./.github/actions/release-secrets # zizmor: ignore[self-repository] use the exact release checkout
        with:
          identity-id: ${{ vars.INFISICAL_RELEASE_IDENTITY_ID }}
          environment: ${{ vars.INFISICAL_RELEASE_ENVIRONMENT || 'prod' }}
          secret-path: /signing/aur
          export-type: file
          file-output-path: /.aur-key.env
      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          # aur.archlinux.org's host key, as published on https://aur.archlinux.org (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4)
          AUR_HOST_KEY: aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
        run: |
          umask 077
          key_env="$GITHUB_WORKSPACE/.aur-key.env"
          ssh_dir="$RUNNER_TEMP/aur-ssh"
          trap 'rm -rf "$key_env" "$ssh_dir"' EXIT
          # Infisical (/signing/aur) first; the repository secret of the same name is the fallback.
          if [[ -s "$key_env" ]]; then
            eval "$(python3 - "$key_env" <<'PY'
          import re, shlex, sys
          text = open(sys.argv[1]).read()
          for key, value in re.findall(r"^([A-Z0-9_]+)='(.*?)'$", text, re.M | re.S):
              if key == "AUR_SSH_PRIVATE_KEY" and value:
                  for line in value.splitlines():
                      if line.strip():
                          print(f"echo {shlex.quote('::add-mask::' + line)}")
                  print(f"{key}={shlex.quote(value)}")
          PY
          )"
            rm -f "$key_env"
          fi
          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            echo "::notice::reins-bin was not pushed to the AUR: AUR_SSH_PRIVATE_KEY is not configured (Infisical /signing/aur)"
            exit 0
          fi
          mkdir -p "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$AUR_HOST_KEY" > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          # A package that does not exist yet clones as an empty repository; the first push creates it.
          git clone --quiet ssh://aur@aur.archlinux.org/reins-bin.git "$ssh_dir/reins-bin"
          cp aur/PKGBUILD aur/.SRCINFO "$ssh_dir/reins-bin/"
          cd "$ssh_dir/reins-bin"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "::notice::reins-bin on the AUR is already $VERSION"
            exit 0
          fi
          git -c user.name="Daniil Katulevskiy" -c user.email=support@reins2fa.com commit --quiet -m "Update to $VERSION"
          git push --quiet origin HEAD:master
          echo "::notice::Pushed reins-bin $VERSION to https://aur.archlinux.org/packages/reins-bin"
