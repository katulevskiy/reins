name: Cancel a closed pull request's runs

# When a pull request is closed or merged, its runs that are still queued or running (CI, iOS, the iOS core cache, the
# agents' iOS jobs) are cancelled (scripts/ci/cancel-closed.py). A bundle merge closes many pull requests at once,
# and their old runs kept taking the macOS runners a release needed. Push runs (main's CI, which each release waits
# for) and release runs are never touched.
#
# Pull requests from this repository's branches only: a fork's pull request gets a read-only token, which cannot
# cancel anything.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cancel:
    name: Cancel the closed pull request's runs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # scripts/ci
      actions: write # cancel the runs
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Cancel its queued and running runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -I scripts/ci/cancel-closed.py
