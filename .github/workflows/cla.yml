name: CLA
# Asks every pull request author to sign the Contributor License Agreement (CLA.md) and records the signatures in the
# `cla-signatures` branch. Setup: CONTRIBUTING.md, "Maintainers: setting up the CLA check".

# pull_request_target runs in the base repository's context so the action can comment and record signatures for pull
# requests from forks. It never checks out or runs the pull request's code.
on: # zizmor: ignore[dangerous-triggers]
  issue_comment:
    types: [ created ]
  pull_request_target:
    types: [ opened, closed, synchronize ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  CLAAssistant:
    name: CLAAssistant
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    # Bots (Dependabot) sign nothing; their pull requests get a read-only token here, so the action could not record them.
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.user.type != 'Bot') ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # The action's repository was archived in 2026; v2.6.1 still works (pinned). Replace it with a maintained fork
      # or the hosted CLA Assistant (cla-assistant.io) if it stops working.
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # zizmor: ignore[archived-uses] v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          # These accounts are never asked to sign. For each commit the action takes the author's GitHub login, or the
          # git author name when the email is not linked to an account (the committer when the author has neither),
          # and matches it exactly and case-sensitively; `*` matches any text. It never reads Co-authored-by trailers,
          # so co-authors are never asked to sign. AI coding agents are listed because the person who submits a pull
          # request is its contributor (CLA.md, section 5). `*[bot]` covers GitHub App accounts; Copilot's coding
          # agent commits as the login `Copilot`, and agents with an unlinked email appear under the names
          # `Cursor Agent`, `Claude`, `Codex` or `Devin AI`.
          allowlist: >-
            dependabot[bot],renovate[bot],github-actions[bot],
            cursoragent,cursor[bot],Cursor Agent,
            claude,claude[bot],Claude,
            Copilot,copilot-swe-agent[bot],
            codex,chatgpt-codex-connector[bot],Codex,
            devin-ai-integration[bot],Devin AI,
            google-labs-jules[bot],
            *[bot]
          lock-pullrequest-aftermerge: false
