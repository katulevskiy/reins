name: CLA
# Asks every pull request author to sign the Contributor License Agreement (CLA.md) and records the signatures in the
# `cla-signatures` branch. Setup: CONTRIBUTING.md, "Maintainers: setting up the CLA check".

# pull_request_target runs in the base repository's context so the action can comment and record signatures for pull
# requests from forks. It never checks out or runs the pull request's code.
on: # zizmor: ignore[dangerous-triggers]
  issue_comment:
    types: [ created ]
  pull_request_target:
    types: [ opened, closed, synchronize ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  CLAAssistant:
    name: CLAAssistant
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # The action's repository was archived in 2026; v2.6.1 still works (pinned). Replace it with a maintained fork
      # or the hosted CLA Assistant (cla-assistant.io) if it stops working.
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # zizmor: ignore[archived-uses] v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],renovate[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
