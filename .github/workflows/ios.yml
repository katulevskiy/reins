name: iOS

# Pull requests run iOS in ci.yml: one macOS job with the core, the build and ReinsTests (docs/reference/ci.md).
# This workflow runs the core, the build, ReinsTests and the five UI shards on a push to main (a newer push cancels the
# older run), the nightly and a hand run (workflow_dispatch, also on a branch, for a pull request whose UI needs a
# look before merging). On main and at night it is background work: its macOS admission waits until nobody else wants
# a runner (.github/workflows/macos-gate.yml), and each UI shard steps aside while anyone does.
# scripts/wait-for-ci.sh waits for ci.yml on that same commit, not this workflow, so none of this holds a release.
# The UI shards never gate a merge: their failures are warnings with the result bundle attached (docs/ios-dev.md).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - crates/reins-core/**
      - crates/reins-proto/**
      - crates/reins-policy/**
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - ios/**
      - .github/workflows/ios.yml
      - scripts/ios-ui-plan.py
  # Nightly on main, off peak, so a class no pull request mapped still runs within a day.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# Pushes to main share one group, and a newer push cancels the older run (its UI shards included, and its admission
# still waiting): the newer commit has every change of the older one. A nightly or hand run keeps its own group per
# commit and is not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'main' || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

defaults:
  run:
    shell: bash

# Same GitHub-hosted runner and Xcode as release.yml's ios-testflight (`xcode-27`, Xcode 27.0). That label
# is in the GitHub Actions runner group, not a self-hosted Mac. The repository variables IOS_RUNNER,
# IOS_DEVELOPER_DIR and IOS_XCODE_VERSION override the three (ios-job.yml and ios-core.yml read the same ones). macos-15 is not a fallback: the release
# workflow records that macos-26 stops at Xcode 26.6, and this project is generated for the 27.0 SDK.
#
# No `environment:` and no secrets. These jobs cannot read the testflight or production environments.
# Simulator only. Tests ad-hoc sign (CODE_SIGN_IDENTITY=-, no certificate, team, or profile) so entitlements
# apply, matching a local simulator build with an empty REINS_TEAM. The core is arm64. No test retries.
#
# Run 38858281608 kept five xcode-27 jobs busy and started the sixth seven seconds after one finished.
# The build is one job before the shards, not a sixth shard beside them. A main push or a hand run runs
# at most three shards at once, so two runners stay free for ci.yml and for a release. The nightly is off
# peak and may take all five. ActivityFlowTests is divided by method. scripts/ios-ui-plan.py owns that
# list. Classes added later still land on rest.
#
# The account's five macOS runners are shared with CI, the agents' iOS jobs and release.yml. Before the core and again
# before the tests, macOS admission (.github/workflows/macos-gate.yml) waits: on main and at night until nobody else
# wants a runner, by hand in turn with everyone else.
#
# The simulator core and the Swift compile cache are written from main only. Pull requests (ci.yml) restore them.
# Build products are uploaded for the shards, not cached: they carry absolute paths, which match this
# runner's workspace (/Users/runner/work/reins/reins) and would not match a different one.

jobs:
  changes:
    name: iOS paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.paths.outputs.ios }}
      ui: ${{ steps.uitests.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select build lanes
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          ios=false
          if [[ "$EVENT" == workflow_dispatch || "$EVENT" == schedule || -z "$BASE_SHA" ||
                "$BASE_SHA" == 0000000000000000000000000000000000000000 ]] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            ios=true
          else
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/workflows/ios.yml) ios=true ;;
                # ci.yml lints every workflow. A change there does not rebuild the simulator core.
                .github/*) ;;
                # The simulator core is a Cargo build. Cargo.toml alone does not change what it links.
                Cargo.lock|rust-toolchain.toml|.cargo/*) ios=true ;;
                crates/reins-core/*|crates/reins-proto/*|crates/reins-policy/*) ios=true ;;
                # The plan decides the suite. A change to it has to run that suite.
                scripts/ios-ui-plan.py) ios=true ;;
                ios/*) ios=true ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" HEAD)
          fi
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
      - name: Select UI tests
        id: uitests
        if: steps.paths.outputs.ios == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
        run: python3 scripts/ios-ui-plan.py select >> "$GITHUB_OUTPUT"

  # The core and the build: one macOS job at a time.
  macos-gate:
    name: macOS admission
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/macos-gate.yml # zizmor: ignore[self-repository] the same commit's gate
    permissions:
      actions: read # the runs and their jobs
      contents: read # scripts/ci
      pull-requests: read # ci:priority and ci:lock
      issues: read # when ci:lock was added
    with:
      # Background on main and at night; a hand run (someone is waiting for it) queues with everyone else.
      background: ${{ github.event_name != 'workflow_dispatch' }}
      macos: 1

  ios-core:
    name: iOS Rust core
    needs: [changes, macos-gate]
    if: needs.changes.outputs.ios == 'true'
    permissions:
      contents: read
      attestations: read # core-cache.sh verifies the prebuilt core's provenance
    runs-on: ${{ vars.IOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    env:
      XCODE_VERSION: ${{ vars.IOS_XCODE_VERSION || '27.0' }}
      DEVELOPER_DIR: ${{ vars.IOS_DEVELOPER_DIR || '/Applications/Xcode_27.0.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode 27.0
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          xcode="$(xcodebuild -version | sed -n 's/^Xcode //p')"
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          arch="$(uname -m)"
          [[ "$xcode" == "$XCODE_VERSION" && "$sdk" == "$XCODE_VERSION" ]] || {
            echo "::error::iOS CI needs Xcode $XCODE_VERSION (simulator SDK $XCODE_VERSION) at $DEVELOPER_DIR; found Xcode $xcode, SDK $sdk"
            exit 1
          }
          # build-core.sh strips DEVELOPER_DIR when it runs cargo. xcode-select is what that cargo still sees.
          [[ "$arch" == arm64 ]] || {
            echo "::error::The simulator core is arm64-only; this runner is $arch"
            exit 1
          }
      # The library and the bindings for exactly these sources. No prefix fallback: a partial match would link
      # a core that was not built from this tree.
      - uses: actions/cache/restore@v5
        id: core
        with:
          path: target/ios-core/iphonesimulator
          key: ios-sim-core-v1-${{ runner.os }}-${{ hashFiles('crates/reins-core/**', 'crates/reins-proto/**', 'crates/reins-policy/**', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'ios/scripts/build-core.sh') }}
      # The core ios-core.yml published from main for this content hash (a release asset whose build provenance
      # core-cache.sh verifies), before building one.
      - name: Prebuilt core
        id: prebuilt
        if: steps.core.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ios/scripts/core-cache.sh fetch iphonesimulator; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust toolchain
        if: steps.core.outputs.cache-hit != 'true' && steps.prebuilt.outputs.hit != 'true'
        run: rustup toolchain install && rustup target add aarch64-apple-ios-sim && rustc -vV
      - uses: Swatinem/rust-cache@v2
        if: steps.core.outputs.cache-hit != 'true' && steps.prebuilt.outputs.hit != 'true'
        with:
          shared-key: macos-ios-sim-core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the simulator core and check the committed bindings
        id: build
        env:
          CACHE_HIT: ${{ steps.core.outputs.cache-hit == 'true' || steps.prebuilt.outputs.hit == 'true' }}
        run: |
          set -euo pipefail
          lib="target/ios-core/iphonesimulator"
          if [[ "$CACHE_HIT" == true && -s "$lib/libreins_core.a" && -s "$lib/include/module.modulemap" &&
                -s "$lib/include/reins_coreFFI.h" && -s "$lib/reins_core.swift" ]]; then
            if ! cmp -s "$lib/reins_core.swift" ios/Core/Generated/reins_core.swift; then
              git diff --no-index -- "$lib/reins_core.swift" ios/Core/Generated/reins_core.swift || true
              echo "::error::ios/Core/Generated/reins_core.swift does not match the UniFFI bindings for these sources."
              exit 1
            fi
            echo "Reused the cached or prebuilt simulator core"
          else
            # Debug is what the test scheme builds. build-core.sh then uses release-low, as a local simulator
            # build does. The TestFlight archive sets CONFIGURATION=Release, which selects the release profile.
            CONFIGURATION=Debug ios/scripts/build-core.sh iphonesimulator
            test -s "$lib/libreins_core.a"
            test -s "$lib/include/module.modulemap"
            test -s "$lib/include/reins_coreFFI.h"
            if ! git diff --exit-code -- ios/Core/Generated/reins_core.swift; then
              echo "::error::ios/Core/Generated/reins_core.swift does not match the UniFFI bindings just generated. Commit the output of ios/scripts/build-core.sh."
              exit 1
            fi
            cp ios/Core/Generated/reins_core.swift "$lib/reins_core.swift"
          fi
          lipo -info "$lib/libreins_core.a" | grep -q arm64
          find "$lib" -type f
      - uses: actions/cache/save@v5
        if: steps.core.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: target/ios-core/iphonesimulator
          key: ${{ steps.core.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-core
          path: target/ios-core/iphonesimulator/
          if-no-files-found: error
          # Keep build inputs as long as test results so failed shards can be rerun.
          retention-days: 7

  ios-build:
    name: iOS build
    needs: [changes, macos-gate, ios-core]
    if: needs.changes.outputs.ios == 'true' && needs.ios-core.result == 'success'
    runs-on: ${{ vars.IOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    env:
      XCODE_VERSION: ${{ vars.IOS_XCODE_VERSION || '27.0' }}
      DEVELOPER_DIR: ${{ vars.IOS_DEVELOPER_DIR || '/Applications/Xcode_27.0.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode 27.0
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcode="$(xcodebuild -version | sed -n 's/^Xcode //p')"
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          [[ "$xcode" == "$XCODE_VERSION" && "$sdk" == "$XCODE_VERSION" ]] || {
            echo "::error::iOS CI needs Xcode $XCODE_VERSION (simulator SDK $XCODE_VERSION) at $DEVELOPER_DIR; found Xcode $xcode, SDK $sdk"
            exit 1
          }
      - uses: actions/download-artifact@v8
        with:
          name: ios-simulator-core
          path: target/ios-core/iphonesimulator
      - name: Require the simulator core
        run: |
          set -euo pipefail
          if [[ ! -s target/ios-core/iphonesimulator/libreins_core.a ||
                ! -s target/ios-core/iphonesimulator/include/module.modulemap ]]; then
            echo "::error::The simulator core artifact is not at target/ios-core/iphonesimulator"
            find target -type f
            exit 1
          fi
      # Module cache, the compilation cache, and Swift packages (ONNX Runtime). Not DerivedData:
      # its products store absolute paths and the simulator id. Restore-keys so a partial hit still
      # compiles less. Exact-key misses are saved from main only; a pull request only restores.
      - uses: actions/cache/restore@v5
        id: swift
        with:
          path: |
            derived/ModuleCache.noindex
            derived/CompilationCache.noindex
            spm
            compilation-cache
          key: ios-swift-v1-${{ runner.os }}-${{ hashFiles('ios/Reins.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'ios/**/*.swift', 'ios/**/*.m', 'ios/**/*.h') }}
          restore-keys: |
            ios-swift-v1-${{ runner.os }}-
      - name: Build for testing
        env:
          MODE: build
        run: bash ios/scripts/ci-xcode-test.sh
      - name: Swift cache size
        if: always() && !cancelled()
        env:
          CACHE_HIT: ${{ steps.swift.outputs.cache-hit }}
        run: |
          python3 - <<'PY'
          import os
          print("swift cache exact hit:", os.environ.get("CACHE_HIT", ""))
          roots = [
              "derived/ModuleCache.noindex",
              "derived/CompilationCache.noindex",
              "spm",
              "compilation-cache",
          ]
          total = 0
          for root in roots:
              size = 0
              if os.path.isdir(root):
                  for dirpath, _, names in os.walk(root):
                      for name in names:
                          try:
                              size += os.path.getsize(os.path.join(dirpath, name))
                          except OSError:
                              pass
              print(f"{root}: {size / 1_000_000:.1f} MB")
              total += size
          print(f"swift cache total: {total / 1_000_000:.1f} MB")
          PY
      # An empty directory fails the save. A marker keeps the job green; the size step above is the real measurement.
      - name: Keep an empty cache path saveable
        if: success() && steps.swift.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for dir in derived/ModuleCache.noindex derived/CompilationCache.noindex spm compilation-cache; do
            mkdir -p "$dir"
            if [[ -z "$(find "$dir" -type f -print -quit)" ]]; then
              : > "$dir/.keep"
            fi
          done
      - uses: actions/cache/save@v5
        if: success() && steps.swift.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: |
            derived/ModuleCache.noindex
            derived/CompilationCache.noindex
            spm
            compilation-cache
          key: ${{ steps.swift.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: ios-test-products
          path: derived/Build/Products
          if-no-files-found: error
          # Keep build inputs as long as test results so failed shards can be rerun.
          retention-days: 7

  # Again before the tests: they are six jobs, three at a time (max-parallel), and others may wait by now.
  macos-gate-tests:
    name: macOS admission (tests)
    needs: [changes, ios-build]
    if: needs.changes.outputs.ios == 'true' && needs.ios-build.result == 'success'
    uses: ./.github/workflows/macos-gate.yml # zizmor: ignore[self-repository] the same commit's gate
    permissions:
      actions: read # the runs and their jobs
      contents: read # scripts/ci
      pull-requests: read # ci:priority and ci:lock
      issues: read # when ci:lock was added
    with:
      # Background on main and at night; a hand run (someone is waiting for it) queues with everyone else.
      background: ${{ github.event_name != 'workflow_dispatch' }}
      macos: 3

  # unit (ReinsTests) gates the iOS check. The five UI shards do not: the job and its test step continue on error, so a
  # failing UI test is a warning on a green job, with its result bundle uploaded, and never holds a merge or a release.
  ios-test:
    name: iOS tests (${{ matrix.shard }})
    needs: [changes, ios-build, macos-gate-tests]
    if: needs.changes.outputs.ios == 'true' && needs.ios-build.result == 'success'
    runs-on: ${{ vars.IOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.shard != 'unit' }}
    permissions:
      contents: read
      actions: read # the runs and their jobs (Step aside)
    strategy:
      fail-fast: false
      # Three at a time on a main push or a hand run. The nightly uses all five.
      max-parallel: ${{ github.event_name == 'schedule' && 5 || 3 }}
      matrix:
        shard: [unit, autopilot, grants, onboarding, field, rest]
    env:
      XCODE_VERSION: ${{ vars.IOS_XCODE_VERSION || '27.0' }}
      DEVELOPER_DIR: ${{ vars.IOS_DEVELOPER_DIR || '/Applications/Xcode_27.0.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # max-parallel starts the later shards as the first ones end, long after macos-gate-tests passed, and a queued job
      # takes a free runner in turn with everyone else's. So each UI shard asks again with its runner in hand
      # (scripts/ci/admit.py --yield), and steps aside (a warning, no tests: every later step needs the plan) while
      # anyone else wants a macOS runner: a release whose "macOS builds" is not created yet, a queued macOS job of CI, a
      # release or an iOS job, or a run waiting for admission. A backlog of shards then drains in seconds instead of
      # holding pull requests and releases back. Only a push to main's shards step aside: the nightly always runs every
      # test, a hand run's shards have someone waiting for them, and the unit shard gates the iOS check. An API error
      # runs the shard.
      - name: Step aside
        id: yield
        if: matrix.shard != 'unit' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_MACOS_LABELS: ${{ vars.IOS_RUNNER || 'xcode-27' }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -uo pipefail
          python3 -I scripts/ci/admit.py --yield
          if grep -q '^skip=true$' "$GITHUB_OUTPUT"; then
            why="$(sed -n 's/^why=//p' "$GITHUB_OUTPUT" | tail -1)"
            echo "::warning title=iOS UI tests (${SHARD})::Skipped: another run wants a macOS runner. $why"
            echo "Skipped the ${SHARD} shard: another run wants a macOS runner. $why" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Plan this shard
        id: plan
        if: steps.yield.outputs.skip != 'true'
        env:
          SHARD: ${{ matrix.shard }}
          CLASSES: ${{ needs.changes.outputs.ui }}
        run: python3 scripts/ios-ui-plan.py shard --name "$SHARD" --classes "$CLASSES" >> "$GITHUB_OUTPUT"
      - name: Select Xcode 27.0
        if: steps.plan.outputs.only != ''
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcode="$(xcodebuild -version | sed -n 's/^Xcode //p')"
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          [[ "$xcode" == "$XCODE_VERSION" && "$sdk" == "$XCODE_VERSION" ]] || {
            echo "::error::iOS CI needs Xcode $XCODE_VERSION (simulator SDK $XCODE_VERSION) at $DEVELOPER_DIR; found Xcode $xcode, SDK $sdk"
            exit 1
          }
      # The built products already link the core. Download them only when this shard has a test.
      - uses: actions/download-artifact@v8
        if: steps.plan.outputs.only != ''
        with:
          name: ios-test-products
          path: derived/Build/Products
      - name: Tests (${{ matrix.shard }})
        id: tests
        if: steps.plan.outputs.only != ''
        continue-on-error: ${{ matrix.shard != 'unit' }}
        env:
          MODE: test-without-building
          ONLY: ${{ steps.plan.outputs.only }}
          SKIP: ${{ steps.plan.outputs.skip }}
        run: |
          set -euo pipefail
          bash ios/scripts/ci-xcode-test.sh
      - name: UI tests failed (not blocking)
        if: matrix.shard != 'unit' && steps.tests.outcome == 'failure'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          echo "::warning title=iOS UI tests (${SHARD})::UI tests failed on this shard. They do not block a merge; the result bundle is the ios-tests-${SHARD}-xcresult artifact."
          echo "UI tests failed on the ${SHARD} shard (not blocking): see the ios-tests-${SHARD}-xcresult artifact." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the test result
        if: failure() || steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ios-tests-${{ matrix.shard }}-xcresult
          path: results.xcresult
          if-no-files-found: ignore
          retention-days: 7


  # The check to require. Shards are skipped when the lane is off, which would leave a required shard
  # pending; this job passes in that case and fails when the unit shard, the build, the core, or the lane selector
  # did. A UI shard continues on error, so its failure never reaches this result.
  ios:
    name: iOS
    needs: [changes, ios-core, ios-build, ios-test]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Result
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          LANE: ${{ needs.changes.outputs.ios }}
          CORE: ${{ needs.ios-core.result }}
          BUILD: ${{ needs.ios-build.result }}
          TESTS: ${{ needs.ios-test.result }}
        run: |
          set -euo pipefail
          echo "event=$EVENT changes=$CHANGES lane=$LANE core=$CORE build=$BUILD tests=$TESTS"
          if [[ "$CHANGES" != success ]]; then
            echo "::error::The changes job did not succeed ($CHANGES)"
            exit 1
          fi
          if [[ "$LANE" != true ]]; then
            for result in "$CORE" "$BUILD" "$TESTS"; do
              [[ "$result" == skipped || "$result" == success ]] || {
                echo "::error::iOS lane was off but a job ended $result"
                exit 1
              }
            done
            echo "iOS skipped: no iOS, core, lockfile, toolchain, or workflow changes"
            exit 0
          fi
          status=0
          [[ "$CORE" == success ]] || { echo "::error::ios-core $CORE"; status=1; }
          [[ "$BUILD" == success ]] || { echo "::error::ios-build $BUILD"; status=1; }
          [[ "$TESTS" == success ]] || { echo "::error::ios-test $TESTS"; status=1; }
          [[ "$status" == 0 ]] && echo "iOS passed"
          exit "$status"
