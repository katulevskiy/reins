name: iOS

# Not on push to main. scripts/wait-for-ci.sh waits for the whole ci.yml run of that push (30 minutes)
# and publishes when it passes. These jobs are slower than that cap. A pull request already ran them.
on:
  pull_request:
  workflow_dispatch:
  # Once a week on main, so the caches pull requests restore stay warm.
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

# A new push to a pull request supersedes its run in progress. The weekly run on main is not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# Same GitHub-hosted runner and Xcode as release.yml's ios-testflight (`xcode-27`, Xcode 27.0). That label
# is in the GitHub Actions runner group, not a self-hosted Mac. macos-15 is not a fallback: the release
# workflow records that macos-26 stops at Xcode 26.6, and this project is generated for the 27.0 SDK.
#
# No `environment:` and no secrets. These jobs cannot read the testflight or production environments.
# Simulator only. Tests ad-hoc sign (CODE_SIGN_IDENTITY=-, no certificate, team, or profile) so entitlements
# apply, matching a local simulator build with an empty REINS_TEAM. The core is arm64. No test retries.
#
# Run 38858281608 kept five xcode-27 jobs busy and started the sixth seven seconds after one finished.
# A sixth test shard would wait for a whole shard. Five shards, started together after the core, is the
# split that finishes soonest. ActivityFlowTests is longer than one shard, so its tests are divided by
# method using the per-test times from that run. ReinsTests (about two minutes) shares the rest shard.
# Classes added later land on rest.
#
# Caches are written from main only (the weekly run and a hand run on main). DerivedData is not cached.

jobs:
  changes:
    name: iOS paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.paths.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select build lanes
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ios=false
          if [[ "$EVENT" == workflow_dispatch || "$EVENT" == schedule || -z "$BASE_SHA" ||
                "$BASE_SHA" == 0000000000000000000000000000000000000000 ]] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            ios=true
          else
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/workflows/ios.yml) ios=true ;;
                # ci.yml lints every workflow. A change there does not rebuild the simulator core.
                .github/*) ;;
                # The simulator core is a Cargo build. Cargo.toml alone does not change what it links.
                Cargo.lock|rust-toolchain.toml|.cargo/*) ios=true ;;
                crates/reins-core/*|crates/reins-proto/*|crates/reins-policy/*) ios=true ;;
                ios/*) ios=true ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" HEAD)
          fi
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  ios-core:
    name: iOS Rust core
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      XCODE_VERSION: "27.0"
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode 27.0
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          xcode="$(xcodebuild -version | sed -n 's/^Xcode //p')"
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          arch="$(uname -m)"
          [[ "$xcode" == "$XCODE_VERSION" && "$sdk" == "$XCODE_VERSION" ]] || {
            echo "::error::iOS CI needs Xcode $XCODE_VERSION (simulator SDK $XCODE_VERSION) at $DEVELOPER_DIR; found Xcode $xcode, SDK $sdk"
            exit 1
          }
          # build-core.sh strips DEVELOPER_DIR when it runs cargo. xcode-select is what that cargo still sees.
          [[ "$arch" == arm64 ]] || {
            echo "::error::The simulator core is arm64-only; this runner is $arch"
            exit 1
          }
      # The library and the bindings for exactly these sources. No prefix fallback: a partial match would link
      # a core that was not built from this tree.
      - uses: actions/cache/restore@v5
        id: core
        with:
          path: target/ios-core/iphonesimulator
          key: ios-sim-core-v1-${{ runner.os }}-${{ hashFiles('crates/reins-core/**', 'crates/reins-proto/**', 'crates/reins-policy/**', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'ios/scripts/build-core.sh') }}
      - name: Install Rust toolchain
        if: steps.core.outputs.cache-hit != 'true'
        run: rustup toolchain install && rustup target add aarch64-apple-ios-sim && rustc -vV
      - uses: Swatinem/rust-cache@v2
        if: steps.core.outputs.cache-hit != 'true'
        with:
          shared-key: macos-ios-sim-core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the simulator core and check the committed bindings
        id: build
        env:
          CACHE_HIT: ${{ steps.core.outputs.cache-hit }}
        run: |
          set -euo pipefail
          lib="target/ios-core/iphonesimulator"
          if [[ "$CACHE_HIT" == true && -s "$lib/libreins_core.a" && -s "$lib/include/module.modulemap" &&
                -s "$lib/include/reins_coreFFI.h" && -s "$lib/reins_core.swift" ]]; then
            if ! cmp -s "$lib/reins_core.swift" ios/Core/Generated/reins_core.swift; then
              git diff --no-index -- "$lib/reins_core.swift" ios/Core/Generated/reins_core.swift || true
              echo "::error::ios/Core/Generated/reins_core.swift does not match the UniFFI bindings for these sources."
              exit 1
            fi
            echo "Reused the cached simulator core"
          else
            # Debug is what the test scheme builds. build-core.sh then uses release-low, as a local simulator
            # build does. The TestFlight archive sets CONFIGURATION=Release, which selects the release profile.
            CONFIGURATION=Debug ios/scripts/build-core.sh iphonesimulator
            test -s "$lib/libreins_core.a"
            test -s "$lib/include/module.modulemap"
            test -s "$lib/include/reins_coreFFI.h"
            if ! git diff --exit-code -- ios/Core/Generated/reins_core.swift; then
              echo "::error::ios/Core/Generated/reins_core.swift does not match the UniFFI bindings just generated. Commit the output of ios/scripts/build-core.sh."
              exit 1
            fi
            cp ios/Core/Generated/reins_core.swift "$lib/reins_core.swift"
          fi
          lipo -info "$lib/libreins_core.a" | grep -q arm64
          find "$lib" -type f
      - uses: actions/cache/save@v5
        if: steps.core.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: target/ios-core/iphonesimulator
          key: ${{ steps.core.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-core
          path: target/ios-core/iphonesimulator/
          if-no-files-found: error
          retention-days: 1

  ios-test:
    name: iOS tests (${{ matrix.shard }})
    needs: [changes, ios-core]
    if: needs.changes.outputs.ios == 'true' && needs.ios-core.result == 'success'
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 10.9 min of tests on run 38858281608. Three tests added since that run stay in this class.
          - shard: autopilot
            only: ReinsUITests/AutopilotUITests
            skip: ""
          # 10.5 min. GrantsSettingsUITests was 10.2 min; one short activity test fills the shard.
          - shard: grants
            only: >-
              ReinsUITests/GrantsSettingsUITests,
              ReinsUITests/ActivityFlowTests/testAnEntryOpensAndAnEmailInItOpensInFull
            skip: ""
          # 10.5 min. OnboardingUITests was 5.0 min; the rest is activity tests.
          - shard: onboarding
            only: >-
              ReinsUITests/OnboardingUITests,
              ReinsUITests/ActivityFlowTests/testTheQuickMenuSwitchesModesAndBypassAsksForALength,
              ReinsUITests/ActivityFlowTests/testAScrollStartingOnAWaitingCardScrollsAndOpensNothing,
              ReinsUITests/ActivityFlowTests/testAScrollStartingOnARowScrollsAndOpensNothing,
              ReinsUITests/ActivityFlowTests/testTheDockOffersHowLongAndApprovingClosesTheScreen,
              ReinsUITests/ActivityFlowTests/testDenyIsOneTap,
              ReinsUITests/ActivityFlowTests/testSwipingARowLeftStillRevealsThisWasWrong,
              ReinsUITests/ActivityFlowTests/testTheModePillOpensTheQuickMenuAndMoreOpensAutopilot,
              ReinsUITests/ActivityFlowTests/testAPushFromAnotherDeviceLoadsItsDiffFromGitHub,
              ReinsUITests/ActivityFlowTests/testTheQuickMenuOffersOvernight,
              ReinsUITests/ActivityFlowTests/testTheSyncNoticeShowsUntilOK,
              ReinsUITests/ActivityFlowTests/testARatedRequestShowsItsRiskAndThatOvernightHeldIt
            skip: ""
          # 10.4 min.
          - shard: field
            only: >-
              ReinsUITests/PasskeyUITests,
              ReinsUITests/ApprovalFieldUITests,
              ReinsUITests/SoundsScreenUITests,
              ReinsUITests/NotificationsUITests,
              ReinsUITests/LaunchTests,
              ReinsUITests/ActivityFlowTests/testAScrollStartingOnARowAutopilotDecidedScrollsAndOpensNothing,
              ReinsUITests/ActivityFlowTests/testTheTabBarStepsAsideForTheKeyboard,
              ReinsUITests/ActivityFlowTests/testTheModeChipOpensOnATapAndOnAPressThatSlidesOntoARow,
              ReinsUITests/ActivityFlowTests/testTappingARowStillOpensIt,
              ReinsUITests/ActivityFlowTests/testALoadThatFailsSaysWhyAndOffersRetry,
              ReinsUITests/ActivityFlowTests/testRowsScrollUnderPaperAtTheTop
            skip: ""
          # 10.4 min of UI tests plus ReinsTests (2.0 min). Anything not named above runs here,
          # including a UI class added later. The live tests skip themselves without their harness.
          - shard: rest
            only: ReinsTests,ReinsUITests
            skip: >-
              ReinsUITests/AutopilotUITests,
              ReinsUITests/GrantsSettingsUITests,
              ReinsUITests/OnboardingUITests,
              ReinsUITests/PasskeyUITests,
              ReinsUITests/ApprovalFieldUITests,
              ReinsUITests/SoundsScreenUITests,
              ReinsUITests/NotificationsUITests,
              ReinsUITests/LaunchTests,
              ReinsUITests/ActivityFlowTests/testAnEntryOpensAndAnEmailInItOpensInFull,
              ReinsUITests/ActivityFlowTests/testTheQuickMenuSwitchesModesAndBypassAsksForALength,
              ReinsUITests/ActivityFlowTests/testAScrollStartingOnAWaitingCardScrollsAndOpensNothing,
              ReinsUITests/ActivityFlowTests/testAScrollStartingOnARowScrollsAndOpensNothing,
              ReinsUITests/ActivityFlowTests/testTheDockOffersHowLongAndApprovingClosesTheScreen,
              ReinsUITests/ActivityFlowTests/testDenyIsOneTap,
              ReinsUITests/ActivityFlowTests/testSwipingARowLeftStillRevealsThisWasWrong,
              ReinsUITests/ActivityFlowTests/testTheModePillOpensTheQuickMenuAndMoreOpensAutopilot,
              ReinsUITests/ActivityFlowTests/testAPushFromAnotherDeviceLoadsItsDiffFromGitHub,
              ReinsUITests/ActivityFlowTests/testTheQuickMenuOffersOvernight,
              ReinsUITests/ActivityFlowTests/testTheSyncNoticeShowsUntilOK,
              ReinsUITests/ActivityFlowTests/testARatedRequestShowsItsRiskAndThatOvernightHeldIt,
              ReinsUITests/ActivityFlowTests/testAScrollStartingOnARowAutopilotDecidedScrollsAndOpensNothing,
              ReinsUITests/ActivityFlowTests/testTheTabBarStepsAsideForTheKeyboard,
              ReinsUITests/ActivityFlowTests/testTheModeChipOpensOnATapAndOnAPressThatSlidesOntoARow,
              ReinsUITests/ActivityFlowTests/testTappingARowStillOpensIt,
              ReinsUITests/ActivityFlowTests/testALoadThatFailsSaysWhyAndOffersRetry,
              ReinsUITests/ActivityFlowTests/testRowsScrollUnderPaperAtTheTop
    env:
      XCODE_VERSION: "27.0"
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode 27.0
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcode="$(xcodebuild -version | sed -n 's/^Xcode //p')"
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          [[ "$xcode" == "$XCODE_VERSION" && "$sdk" == "$XCODE_VERSION" ]] || {
            echo "::error::iOS CI needs Xcode $XCODE_VERSION (simulator SDK $XCODE_VERSION) at $DEVELOPER_DIR; found Xcode $xcode, SDK $sdk"
            exit 1
          }
      - uses: actions/download-artifact@v8
        with:
          name: ios-simulator-core
          path: target/ios-core/iphonesimulator
      - name: Require the simulator core
        run: |
          set -euo pipefail
          if [[ ! -s target/ios-core/iphonesimulator/libreins_core.a ||
                ! -s target/ios-core/iphonesimulator/include/module.modulemap ]]; then
            echo "::error::The simulator core artifact is not at target/ios-core/iphonesimulator"
            find target -type f | head -50
            exit 1
          fi
      # Swift packages only (ONNX Runtime). DerivedData is left uncached: it stores absolute paths and the
      # simulator id, so a restore onto another runner is not a safe hit.
      - uses: actions/cache/restore@v5
        id: spm
        with:
          path: spm
          key: ios-spm-v1-${{ runner.os }}-${{ hashFiles('ios/Reins.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Tests (${{ matrix.shard }})
        env:
          ONLY: ${{ matrix.only }}
          SKIP: ${{ matrix.skip }}
        run: |
          set -euo pipefail
          bash ios/scripts/ci-xcode-test.sh
      # One writer. The other shards only restore, so parallel saves cannot race.
      - uses: actions/cache/save@v5
        if: matrix.shard == 'rest' && steps.spm.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: spm
          key: ${{ steps.spm.outputs.cache-primary-key }}
      - name: Upload the test result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-tests-${{ matrix.shard }}-xcresult
          path: results.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # The check to require. Shards are skipped when the lane is off, which would leave a required shard
  # pending; this job passes in that case and fails when a shard, the core build, or the lane selector did.
  ios:
    name: iOS
    needs: [changes, ios-core, ios-test]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Result
        env:
          CHANGES: ${{ needs.changes.result }}
          LANE: ${{ needs.changes.outputs.ios }}
          CORE: ${{ needs.ios-core.result }}
          TESTS: ${{ needs.ios-test.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES lane=$LANE core=$CORE tests=$TESTS"
          if [[ "$CHANGES" != success ]]; then
            echo "::error::The changes job did not succeed ($CHANGES)"
            exit 1
          fi
          if [[ "$LANE" != true ]]; then
            for result in "$CORE" "$TESTS"; do
              [[ "$result" == skipped || "$result" == success ]] || {
                echo "::error::iOS lane was off but a job ended $result"
                exit 1
              }
            done
            echo "iOS skipped: no iOS, core, lockfile, toolchain, or workflow changes"
            exit 0
          fi
          status=0
          [[ "$CORE" == success ]] || { echo "::error::ios-core $CORE"; status=1; }
          [[ "$TESTS" == success ]] || { echo "::error::ios-test $TESTS"; status=1; }
          [[ "$status" == 0 ]] && echo "iOS passed"
          exit "$status"
