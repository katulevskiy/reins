name: CI

# Pull requests are tested once, on the pull_request event (the merge result), not again on every push to their branch;
# pushes are tested on main only, which is what release.yml releases. Any branch can still be run by hand.
on:
  push:
    branches: [main]
  pull_request:
    # Nothing here reads them; Lint still checks the docs' spelling and links.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE*"
      - "NOTICE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # No debug info in CI builds: smaller target dirs and caches, faster links. Panics still name the file and line.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  fmt:
    name: Rust fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the channel and components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc -vV
      - run: cargo fmt --all -- --check

  clippy:
    name: Rust clippy (Reins crates)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc -vV
      # Each job's dependency build is cached per Cargo.lock and toolchain. Only main writes the caches; pull requests
      # (and main itself) read main's, so branch copies never crowd main's out of the repository's 10 GB.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The desktop app (GPUI) links the system's X11/Wayland, font and Vulkan libraries.
      - name: GUI libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev \
            libx11-xcb-dev libfontconfig1-dev libfreetype-dev libvulkan-dev pkg-config
      - run: cargo clippy --locked --workspace --exclude vaultwarden --all-targets -- -D warnings
      - run: cargo test --locked -p reins-desktop-app

  test:
    name: Rust tests (Reins crates)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The desktop and e2e tests start the real server; crates/reins-e2e/src/server.rs builds it with exactly
      # these arguments, so building it up front makes that a no-op and shows compile errors on their own.
      - name: Build server (sqlite)
        run: cargo build --locked --features sqlite --bin vaultwarden
      - name: Test crates
        run: cargo test --locked -p reins-proto -p reins-policy -p reins-core -p reins-desktop -p reins-laya

  # Its own job: cargo runs test binaries one after another, and these take minutes, as do the crates' above.
  e2e:
    name: Rust tests (end to end)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # As in the test job: the tests' own build of the server becomes a no-op.
      - name: Build server (sqlite)
        run: cargo build --locked --features sqlite --bin vaultwarden
      - name: Test end to end
        run: cargo test --locked -p reins-e2e

  desktop-macos:
    name: Desktop app on macOS (clippy + tests)
    # The release builds the desktop app for macOS too (release.yml); this keeps it compiling and its tests passing.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p reins-desktop --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast -p reins-desktop

  desktop-windows:
    name: Desktop app on Windows (clippy + tests)
    # The release builds the desktop app for Windows too (release.yml); this keeps it compiling and its tests passing,
    # and runs the background service for real (tests/windows_service.rs writes this runner's HKCU Run key).
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      REINS_TEST_WINDOWS_SERVICE: "1"
    steps:
      # Git on the Windows runners checks text files out with CRLF; the tests expect the files as committed.
      - name: Check out without CRLF
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustup target add aarch64-pc-windows-msvc && rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p reins-desktop --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast -p reins-desktop
      # scripts/install.ps1 as `irm | iex` runs it, in Windows PowerShell 5.1, from a release made here of the test
      # build: install, then install over it, then the user PATH has it.
      - name: Install script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Join-Path $env:RUNNER_TEMP 'release'
          $name = 'reins-desktop-0.0.0-x86_64-pc-windows-msvc'
          New-Item -ItemType Directory -Force -Path "$rel\$name" | Out-Null
          Copy-Item target\debug\reins.exe "$rel\$name\"
          Compress-Archive -Path "$rel\$name" -DestinationPath "$rel\$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$rel\$name.zip").Hash.ToLowerInvariant()
          Set-Content -Path "$rel\SHA256SUMS" -Value "$hash  $name.zip"
          $env:REINS_RELEASE_DIR = $rel
          $env:REINS_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'Reins'
          Get-Content scripts\install.ps1 -Raw | Invoke-Expression
          Get-Content scripts\install.ps1 -Raw | Invoke-Expression
          & "$env:REINS_INSTALL_DIR\reins.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'the installed reins.exe does not run' }
          $userPath = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (($userPath -split ';') -notcontains $env:REINS_INSTALL_DIR) { throw "not on the user PATH: $userPath" }
          Set-Content -Path "$rel\SHA256SUMS" -Value "$('0' * 64)  $name.zip"
          $failed = $false
          try { Get-Content scripts\install.ps1 -Raw | Invoke-Expression } catch { $failed = $_.ToString() -match 'checksum' }
          if (-not $failed) { throw 'a download that does not match SHA256SUMS was installed' }
      # The release builds Windows on Arm on this runner, without running it, and leaves it out when it fails; this
      # shows early whether it compiles, without failing CI (and so holding releases back) when it does not.
      - name: Check aarch64-pc-windows-msvc
        continue-on-error: true
        run: cargo check --locked -p reins-desktop --bin reins --target aarch64-pc-windows-msvc

  release-scripts:
    name: Release scripts (versioning, notes)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash -n scripts/next-version.sh scripts/release-notes.sh scripts/set-desktop-version.sh scripts/release-desktop.sh
      - run: scripts/test-next-version.sh
      # The Windows install script parses (pwsh is on the Linux runners too).
      - name: Parse scripts/install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

  server:
    name: Server (sqlite) clippy + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Not --all-targets: upstream Vaultwarden's own test modules (src/api/admin.rs, src/http_client.rs) trip newer
      # clippy lints, and upstream CI never linted test targets either. Reins's crates are linted with all targets.
      - run: cargo clippy --locked --features sqlite -- -D warnings
      - run: cargo test --locked --features sqlite

  android:
    name: Android unit tests + debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Rust toolchain and Android targets
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
          rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-ndk
        run: cargo ndk --version || cargo install --locked cargo-ndk@4.1.2
      # The NDK version is the one app/build.gradle.kts pins (reinsNdkVersion); the build looks it up by path.
      - name: Install Android NDK
        run: |
          ndk="$(grep -oP 'reinsNdkVersion = "\K[^"]+' android/app/build.gradle.kts)"
          echo "NDK ${ndk}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ndk}" > /dev/null
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # No google-services.json in CI: the build skips the Firebase plugin (hasFirebase) and still assembles.
      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testFullDebugUnitTest :app:testPlayDebugUnitTest :app:assembleFullDebug -Preins.rustProfile=debug
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
