name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Every lane on main once a week, so the caches pull requests restore stay warm: GitHub drops a cache nobody has
  # used for seven days, and a lane only runs on main when a merge touches it.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

# A new push to a pull request supersedes its run in progress. Runs on main are never cancelled: each main commit needs
# its own CI result (the release waits for it, scripts/wait-for-ci.sh) and its cache writes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# Caches are written by runs on main only (pushes and the weekly run) and restored everywhere: a pull request starts
# from main's caches and never writes its own, which no other branch could read and which would push main's out of the
# repository's 10 GB. Any change to these variables changes every Rust cache key.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Which suites this change needs, which of them already passed on the same inputs, and how many macOS jobs the run
  # starts (scripts/ci/plan.py; docs/reference/ci.md). Pull requests get the fast tier: desktop-macos only when the
  # change can be macOS specific; the `ci:full` label (then re-run) or CI_PR_TIER=full runs it for every change its
  # files select. A suite that passed on the same inputs is skipped: every suite job records its pass as its last
  # step.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the pull request's files and labels
      actions: read # earlier passes (Actions cache entries)
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
      keys: ${{ steps.plan.outputs.keys }}
      macos: ${{ steps.plan.outputs.macos }}
      docker: ${{ steps.plan.outputs.docker }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Plan the suites
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_PR_TIER: ${{ vars.CI_PR_TIER }}
        run: python3 -I scripts/ci/plan.py

  # Waits until macOS runners are free for every macOS job of this run (scripts/ci/admit.py): releases first, then
  # main's CI (which passes at once: the release of that commit waits for this run), ci:lock and ci:priority pull
  # requests, everyone else first come, first served, and ios.yml's background runs last.
  admit:
    name: macOS admission
    needs: plan
    if: needs.plan.outputs.macos != '0'
    uses: ./.github/workflows/macos-gate.yml # zizmor: ignore[self-repository] the same commit's gate
    permissions:
      actions: read # the runs and their jobs
      contents: read # scripts/ci
      pull-requests: read # ci:priority and ci:lock, and the heads of the pull requests that claim them
      issues: read # when ci:lock was added
    with:
      wait: ${{ github.event_name != 'push' }}
      macos: ${{ fromJSON(needs.plan.outputs.macos) }}
      pr: ${{ needs.plan.outputs.pr }}

  checks:
    name: Format, docs, scripts and workflow checks
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: python3 scripts/check-branding.py
      # ios.yml builds the app. This catches two branches that each add a type of one name, without a Mac.
      - run: python3 scripts/check-swift-duplicates.py
      - run: python3 scripts/test-android-release.py
      - run: python3 scripts/test-play-upload.py
      - run: python3 scripts/test-testflight.py
      - run: python3 scripts/test-ci-release-gate.py
      - run: python3 scripts/test-supersede-releases.py
      - run: python3 scripts/check-doc-links.py
      - run: python3 scripts/test-ci-routing.py
      - run: python3 scripts/test-ci-plan.py
      - run: python3 scripts/test-ci-admit.py
      - run: python3 scripts/test-ci-reuse.py
      - run: python3 scripts/test-prune-caches.py
      - run: python3 scripts/test-ios-ui-plan.py
      - name: Conflict markers and shell syntax
        run: |
          status=0
          git grep -n -I -E '^(<<<<<<<|>>>>>>>)( |$)|^=======$' -- . ':(exclude)*.patch' ':(exclude)*.diff' || status=$?
          [[ "$status" == 1 ]] || { echo "::error::Conflict marker check failed"; exit 1; }
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(git ls-files -z 'scripts/*.sh' 'scripts/package/*.sh' 'ios/scripts/*.sh')
          scripts/test-next-version.sh
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - uses: zizmorcore/zizmor-action@v0.6.4
        with:
          inputs: ./.github/
          advanced-security: false
      - name: Docker templates
        if: needs.plan.outputs.docker == 'true'
        working-directory: docker
        run: |
          make
          git diff --exit-code
      - uses: hadolint/hadolint-action@v3.5.0
        if: needs.plan.outputs.docker == 'true'
        with:
          dockerfile: docker/Dockerfile.debian
      - uses: hadolint/hadolint-action@v3.5.0
        if: needs.plan.outputs.docker == 'true'
        with:
          dockerfile: docker/Dockerfile.alpine
      - name: Docker build checks
        if: needs.plan.outputs.docker == 'true'
        run: |
          docker build --check . -f docker/Dockerfile.debian
          docker build --check . -f docker/Dockerfile.alpine

  rust:
    name: Server and core tests (Nextest)
    needs: plan
    if: fromJSON(needs.plan.outputs.suites)['rust']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 2,000 grant-soundness cases on the weekly run and on a manual dispatch. Pull requests and pushes
    # to main stay at 256: a release waits for main's CI.
    env:
      PROPTEST_CASES: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '2000' || '256' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-server-core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.146
      # Cargo builds the normal server binary for tests/reins_server (CARGO_BIN_EXE_vaultwarden).
      # Nextest compiles all targets before starting E2E tests, so a separate server build is redundant.
      # The tests' temporary directories on tmpfs: the encrypted store rewrites and syncs its whole file on every change.
      - name: Run all Rust tests
        env:
          REINS_TEST_SERVER_BINARY: ${{ github.workspace }}/target/debug/vaultwarden
        run: |
          export TMPDIR=/dev/shm/reins-tests
          mkdir -p "$TMPDIR"
          cargo nextest run --locked --workspace --exclude reins-desktop-app --features sqlite --no-fail-fast --test-threads 8
      # Nextest does not run doctests; retain Cargo's separate documentation test pass.
      - name: Documentation tests
        run: cargo test --locked --workspace --exclude reins-desktop-app --features sqlite --doc
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: fromJSON(needs.plan.outputs.keys)['rust']
        uses: actions/cache/save@v5
        with:
          path: rust-toolchain.toml
          key: ${{ fromJSON(needs.plan.outputs.keys)['rust'] }}-rust

  rust-clippy:
    name: Server and core Clippy
    needs: plan
    if: fromJSON(needs.plan.outputs.suites)['clippy']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      # The tests' cache, read only: its registry, build scripts and proc macros are what clippy reuses (it checks the
      # rest). A cache of its own (500 MB) pushed the release's out of the repository's 10 GB, and this job ends well
      # before the tests do.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-server-core
          save-if: false
      # Preserve the existing lint coverage: all core targets and the production server target.
      - run: cargo clippy --locked --workspace --exclude vaultwarden --exclude reins-desktop-app --all-targets -- -D warnings
      - run: cargo clippy --locked --features sqlite -- -D warnings

  # Decisions v2 (docs/design/decisions-v2/07-roadmap.md §3): every change to the consequence engine, the default
  # policy or the replay corpus is replayed against the labelled history. A labelled real risk or a case for a person
  # not asked, a known false positive asked again, Full certainty more than half a point below
  # crates/reins-replay/baseline.json, or an ask rate more than a point above it fails the build.
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: fromJSON(needs.plan.outputs.keys)['clippy']
        uses: actions/cache/save@v5
        with:
          path: rust-toolchain.toml
          key: ${{ fromJSON(needs.plan.outputs.keys)['clippy'] }}-clippy

  replay:
    name: Replay gate (Decisions v2)
    needs: plan
    if: fromJSON(needs.plan.outputs.suites)['replay']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-server-core
          save-if: false
      - name: Replay the labelled corpus
        run: |
          set -o pipefail
          cargo run --locked -q -p reins-replay -- run --engine effects --check 2>&1 | tee replay.txt
          { echo '```'; cat replay.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: fromJSON(needs.plan.outputs.keys)['replay']
        uses: actions/cache/save@v5
        with:
          path: rust-toolchain.toml
          key: ${{ fromJSON(needs.plan.outputs.keys)['replay'] }}-replay

  desktop-linux:
    name: Desktop UI on Linux (clippy + tests)
    needs: plan
    if: fromJSON(needs.plan.outputs.suites)['desktop-linux']
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-desktop-ui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: GUI libraries
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev libfontconfig1-dev libfreetype-dev libvulkan-dev pkg-config
      - run: cargo clippy --locked -p reins-desktop-app --all-targets -- -D warnings
      - run: cargo test --locked -p reins-desktop-app

  # The release's Linux packages and repositories (scripts/package/linux-packages.sh, linux-repos.sh, aur.sh and
  # release-feed.sh --packages) from a fake release: built, linted, signed with a throwaway key, checked with apt and
  # installed in Debian and Fedora containers (scripts/test-linux-packages.py). The same nfpm as release.yml.
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: fromJSON(needs.plan.outputs.keys)['desktop-linux']
        uses: actions/cache/save@v5
        with:
          path: rust-toolchain.toml
          key: ${{ fromJSON(needs.plan.outputs.keys)['desktop-linux'] }}-desktop-linux

  linux-packages:
    name: Linux packages and repositories
    needs: plan
    if: fromJSON(needs.plan.outputs.suites)['packages']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NFPM_VERSION: 2.47.0
      NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783 # nfpm_2.47.0_Linux_x86_64.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Packaging tools
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends lintian createrepo-c rpm apt-utils \
            binutils-aarch64-linux-gnu
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
      - run: NFPM="$RUNNER_TEMP/nfpm" python3 scripts/test-linux-packages.py
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: fromJSON(needs.plan.outputs.keys)['packages']
        uses: actions/cache/save@v5
        with:
          path: rust-toolchain.toml
          key: ${{ fromJSON(needs.plan.outputs.keys)['packages'] }}-packages

  # After macOS admission. On a pull request only when the change can be macOS specific (the fast tier, plan.py).
  desktop-macos:
    name: Desktop app on macOS (clippy + tests)
    # The release builds the desktop app for macOS too (release.yml); this keeps it compiling and its tests passing.
    needs: [plan, admit]
    if: fromJSON(needs.plan.outputs.suites)['desktop-macos']
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p reins-desktop --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast -p reins-desktop
      # The app's macOS parts (the menu bar item, notifications, the Dock) are otherwise first compiled by the release.
      - run: cargo clippy --locked -p reins-desktop-app --all-targets -- -D warnings
      - run: cargo test --locked -p reins-desktop-app
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: fromJSON(needs.plan.outputs.keys)['desktop-macos']
        uses: actions/cache/save@v5
        with:
          path: rust-toolchain.toml
          key: ${{ fromJSON(needs.plan.outputs.keys)['desktop-macos'] }}-desktop-macos

  desktop-windows:
    name: Desktop app on Windows (clippy + tests)
    # The release builds the desktop app for Windows too (release.yml); this keeps it compiling and its tests passing,
    # and runs the background service for real (tests/windows_service.rs writes this runner's HKCU Run key).
    needs: plan
    if: fromJSON(needs.plan.outputs.suites)['desktop-windows']
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      REINS_TEST_WINDOWS_SERVICE: "1"
    steps:
      # Git on the Windows runners checks text files out with CRLF; the tests expect the files as committed.
      - name: Check out without CRLF
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustup target add aarch64-pc-windows-msvc && rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p reins-desktop --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast -p reins-desktop
      # The app's Windows parts (the tray's tray-icon menu, the toast, the window's place) are otherwise first compiled by
      # the release.
      - run: cargo clippy --locked -p reins-desktop-app --all-targets -- -D warnings
      - run: cargo test --locked -p reins-desktop-app
      # scripts/install.ps1 as `irm | iex` runs it, in Windows PowerShell 5.1, from a release made here of the test
      # build: install, then install over it, then the user PATH has it.
      - name: Install script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Join-Path $env:RUNNER_TEMP 'release'
          $name = 'reins-desktop-0.0.0-x86_64-pc-windows-msvc'
          New-Item -ItemType Directory -Force -Path "$rel\$name" | Out-Null
          Copy-Item target\debug\reins.exe "$rel\$name\"
          Compress-Archive -Path "$rel\$name" -DestinationPath "$rel\$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$rel\$name.zip").Hash.ToLowerInvariant()
          Set-Content -Path "$rel\SHA256SUMS" -Value "$hash  $name.zip"
          $env:REINS_RELEASE_DIR = $rel
          $env:REINS_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'Reins'
          Get-Content scripts\install.ps1 -Raw | Invoke-Expression
          Get-Content scripts\install.ps1 -Raw | Invoke-Expression
          & "$env:REINS_INSTALL_DIR\reins.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'the installed reins.exe does not run' }
          $userPath = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (($userPath -split ';') -notcontains $env:REINS_INSTALL_DIR) { throw "not on the user PATH: $userPath" }
          Set-Content -Path "$rel\SHA256SUMS" -Value "$('0' * 64)  $name.zip"
          $failed = $false
          try { Get-Content scripts\install.ps1 -Raw | Invoke-Expression } catch { $failed = $_.ToString() -match 'checksum' }
          if (-not $failed) { throw 'a download that does not match SHA256SUMS was installed' }
      # The release builds Windows on Arm on this runner, without running it, and leaves it out when it fails; this
      # shows early whether it compiles, without failing CI (and so holding releases back) when it does not.
      - name: Check aarch64-pc-windows-msvc
        continue-on-error: true
        run: cargo check --locked -p reins-desktop --bin reins --target aarch64-pc-windows-msvc
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: fromJSON(needs.plan.outputs.keys)['desktop-windows']
        uses: actions/cache/save@v5
        with:
          path: rust-toolchain.toml
          key: ${{ fromJSON(needs.plan.outputs.keys)['desktop-windows'] }}-desktop-windows

  android-native:
    name: Android debug native (${{ matrix.kind }})
    needs: plan
    if: fromJSON(needs.plan.outputs.suites)['android']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kind: [arm64-v8a, x86_64, bindings]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Outputs of exactly these sources (no prefix fallback), restored everywhere and saved from main. This workflow is
      # not in the key (any edit to it would miss): bump the v2 when this job's build or the Cargo variables above change.
      - uses: actions/cache/restore@v5
        id: native
        with:
          path: native
          key: android-native-dev-v2-${{ runner.os }}-${{ matrix.kind }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'crates/reins-core/**', 'crates/reins-proto/**', 'crates/reins-policy/**', 'android/app/build.gradle.kts', 'scripts/build-android-native.sh') }}
      - name: Install Rust toolchain and Android targets
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        if: steps.native.outputs.cache-hit != 'true'
        with:
          # Bindgen can read the host dependencies built by the server/core tests; do not duplicate that cache.
          shared-key: ${{ matrix.kind == 'bindings' && 'linux-server-core' || format('android-debug-native-{0}', matrix.kind) }}
          save-if: ${{ matrix.kind != 'bindings' && github.ref == 'refs/heads/main' }}
      - uses: actions/cache/restore@v5
        id: cargo-ndk
        if: steps.native.outputs.cache-hit != 'true' && matrix.kind != 'bindings'
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-4.1.2
      - name: Install cargo-ndk and NDK
        if: steps.native.outputs.cache-hit != 'true' && matrix.kind != 'bindings'
        run: |
          cargo ndk --version || cargo install --locked cargo-ndk@4.1.2
          ndk="$(grep -oP 'reinsNdkVersion = "\K[^"]+' android/app/build.gradle.kts)"
          # The runner image does not carry this NDK; its download from dl.google.com fails now and then.
          for attempt in 1 2 3; do
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ndk}" > /dev/null && break
            (( attempt < 3 )) || exit 1
            echo "::warning::sdkmanager could not install ndk;${ndk} (attempt $attempt); trying again"
            sleep $(( attempt * 20 ))
          done
      - uses: actions/cache/save@v5
        if: >-
          steps.cargo-ndk.outcome == 'success' && steps.cargo-ndk.outputs.cache-hit != 'true' &&
          github.ref == 'refs/heads/main'
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-4.1.2
      - name: Build debug native output
        if: steps.native.outputs.cache-hit != 'true'
        env:
          KIND: ${{ matrix.kind }}
        run: scripts/build-android-native.sh "$KIND" "$GITHUB_WORKSPACE/native" dev
      - uses: actions/cache/save@v5
        if: steps.native.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: native
          key: ${{ steps.native.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-native-${{ matrix.kind }}
          path: native/
          if-no-files-found: error
          retention-days: 1
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: fromJSON(needs.plan.outputs.keys)['android']
        uses: actions/cache/save@v5
        with:
          path: rust-toolchain.toml
          key: ${{ fromJSON(needs.plan.outputs.keys)['android'] }}-native-${{ matrix.kind }}

  android-release-smoke:
    name: Android minified Trust smoke test
    needs: [plan, android-native]
    if: fromJSON(needs.plan.outputs.suites)['android']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v8
        with:
          pattern: android-debug-native-*
          merge-multiple: true
          path: native
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Create a test-only signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/trust-test.keystore" -storepass android \
            -alias androiddebugkey -keypass android -dname "CN=Android Test" -keyalg RSA -validity 2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >-
            cd android && ./gradlew --no-daemon --console=plain --no-configuration-cache connectedFullReleaseAndroidTest
            -Preins.prebuiltNativeDir="$GITHUB_WORKSPACE/native"
            -Preins.testBuildType=release -Preins.secureScreens=false
            -Preins.testRunner=dev.reins.android.TrustTestRunner
            -Preins.releaseKeystore="$RUNNER_TEMP/trust-test.keystore"
            -Preins.releaseKeystorePassword=android -Preins.releaseKeyAlias=androiddebugkey
            -Pandroid.testInstrumentationRunnerArguments.class=dev.reins.android.TrustReleaseTest
      - name: Require the regression test to execute
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = Path("android/app/build/outputs/androidTest-results/connected/release")
          cases = [case for path in reports.rglob("TEST-*.xml") for case in ET.parse(path).iter("testcase")]
          trust = [case for case in cases if case.get("classname") == "dev.reins.android.TrustReleaseTest"]
          assert trust, "Trust regression never ran (the instrumentation process may have crashed before test discovery)"
          assert all(case.find("failure") is None and case.find("error") is None and case.find("skipped") is None for case in trust)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-trust-release-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/mapping/fullRelease/mapping.txt
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: fromJSON(needs.plan.outputs.keys)['android']
        uses: actions/cache/save@v5
        with:
          path: rust-toolchain.toml
          key: ${{ fromJSON(needs.plan.outputs.keys)['android'] }}-smoke

  android:
    name: Android ${{ matrix.lane }}
    needs: [plan, android-native]
    if: fromJSON(needs.plan.outputs.suites)['android']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Three runners, so no lane waits on another's compiling or dexing. The shared suite runs under `full`; `play`
    # runs only its own tests (see testOptions in android/app/build.gradle.kts).
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: full unit tests
            id: full
            tasks: :app:testFullDebugUnitTest
          - lane: play unit tests
            id: play
            tasks: :app:testPlayDebugUnitTest
          - lane: debug APK
            id: apk
            tasks: :app:assembleFullDebug
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v8
        with:
          pattern: android-debug-native-*
          merge-multiple: true
          path: native
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Robolectric downloads its Android framework jar outside Gradle's cache.
      - name: Restore Robolectric's Android jar
        if: matrix.id != 'apk'
        id: robolectric
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('android/gradle/libs.versions.toml') }}
      # The tests and the APK use exact-source debug native outputs from the parallel workers.
      - name: Gradle
        working-directory: android
        env:
          TASKS: ${{ matrix.tasks }}
        run: |
          # A test JVM still running after four minutes is stuck: print its threads before Gradle's test timeout
          # stops it, so the log says where.
          (
            while sleep 30; do
              for pid in $(pgrep -f 'java.*Gradle Test Executor'); do
                if (( $(ps -o etimes= -p "$pid" || echo 0) > 240 )) && [[ ! -e "$RUNNER_TEMP/dumped-$pid" ]]; then
                  touch "$RUNNER_TEMP/dumped-$pid"
                  jcmd "$pid" Thread.print || true
                fi
              done
            done
          ) &
          ./gradlew --no-daemon --parallel --no-configuration-cache "$TASKS" \
            "-Preins.prebuiltNativeDir=$GITHUB_WORKSPACE/native"
      - name: Save Robolectric's Android jar
        if: matrix.id == 'full' && github.ref == 'refs/heads/main' && steps.robolectric.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.cache-primary-key }}
      - name: Verify debug APK native architectures
        if: matrix.id == 'apk'
        run: |
          python3 - <<'PYTHON'
          import importlib.util
          spec = importlib.util.spec_from_file_location("apk", "scripts/check-android-apk.py")
          checker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checker)
          checker.validate_native_libraries("android/app/build/outputs/apk/full/debug/app-full-debug.apk")
          PYTHON
      - name: Upload test reports
        if: failure() && matrix.id != 'apk'
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports-${{ matrix.id }}
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: fromJSON(needs.plan.outputs.keys)['android']
        uses: actions/cache/save@v5
        with:
          path: rust-toolchain.toml
          key: ${{ fromJSON(needs.plan.outputs.keys)['android'] }}-${{ matrix.id }}

  # iOS for pull requests and manual runs, as one macOS job: the chain of three (core, build, tests) joined the macOS
  # queue three times (docs/reference/ci.md). The prebuilt core ios-core.yml published from main (or this job's own
  # build of it), the check of the committed bindings, the build for testing with main's Swift cache, then ReinsTests.
  # Nothing here is saved to a cache: ios.yml writes them from main, where it runs iOS with the UI tests in the
  # background (releases wait for this workflow, and iOS must never hold one). Same runner, Xcode and ad-hoc simulator
  # signing as ios.yml: no secrets, no `environment:`.
  ios:
    name: iOS
    needs: [plan, admit]
    if: fromJSON(needs.plan.outputs.suites)['ios']
    permissions:
      contents: read
      attestations: read # core-cache.sh verifies the prebuilt core's provenance
    runs-on: ${{ vars.IOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 75
    env:
      XCODE_VERSION: ${{ vars.IOS_XCODE_VERSION || '27.0' }}
      DEVELOPER_DIR: ${{ vars.IOS_DEVELOPER_DIR || '/Applications/Xcode_27.0.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode 27.0
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          xcode="$(xcodebuild -version | sed -n 's/^Xcode //p')"
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          [[ "$xcode" == "$XCODE_VERSION" && "$sdk" == "$XCODE_VERSION" ]] || {
            echo "::error::iOS CI needs Xcode $XCODE_VERSION (simulator SDK $XCODE_VERSION) at $DEVELOPER_DIR; found Xcode $xcode, SDK $sdk"
            exit 1
          }
          # build-core.sh strips DEVELOPER_DIR when it runs cargo. xcode-select is what that cargo still sees.
          [[ "$(uname -m)" == arm64 ]] || { echo "::error::The simulator core is arm64-only; this runner is $(uname -m)"; exit 1; }
      # The library and the bindings for exactly these sources (ios.yml's key). No prefix fallback: a partial match would
      # link a core that was not built from this tree.
      - uses: actions/cache/restore@v5
        id: core
        with:
          path: target/ios-core/iphonesimulator
          key: ios-sim-core-v1-${{ runner.os }}-${{ hashFiles('crates/reins-core/**', 'crates/reins-proto/**', 'crates/reins-policy/**', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'ios/scripts/build-core.sh') }}
      - name: Prebuilt core
        id: prebuilt
        if: steps.core.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ios/scripts/core-cache.sh fetch iphonesimulator; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust toolchain
        if: steps.core.outputs.cache-hit != 'true' && steps.prebuilt.outputs.hit != 'true'
        run: rustup toolchain install && rustup target add aarch64-apple-ios-sim && rustc -vV
      - uses: Swatinem/rust-cache@v2
        if: steps.core.outputs.cache-hit != 'true' && steps.prebuilt.outputs.hit != 'true'
        with:
          shared-key: macos-ios-sim-core
          save-if: false
      - name: Build the simulator core and check the committed bindings
        env:
          CACHE_HIT: ${{ steps.core.outputs.cache-hit == 'true' || steps.prebuilt.outputs.hit == 'true' }}
        run: |
          set -euo pipefail
          lib="target/ios-core/iphonesimulator"
          if [[ "$CACHE_HIT" == true && -s "$lib/libreins_core.a" && -s "$lib/include/module.modulemap" &&
                -s "$lib/include/reins_coreFFI.h" && -s "$lib/reins_core.swift" ]]; then
            if ! cmp -s "$lib/reins_core.swift" ios/Core/Generated/reins_core.swift; then
              git diff --no-index -- "$lib/reins_core.swift" ios/Core/Generated/reins_core.swift || true
              echo "::error::ios/Core/Generated/reins_core.swift does not match the UniFFI bindings for these sources."
              exit 1
            fi
            echo "Reused the cached or prebuilt simulator core"
          else
            CONFIGURATION=Debug ios/scripts/build-core.sh iphonesimulator
            test -s "$lib/libreins_core.a"
            test -s "$lib/include/module.modulemap"
            test -s "$lib/include/reins_coreFFI.h"
            if ! git diff --exit-code -- ios/Core/Generated/reins_core.swift; then
              echo "::error::ios/Core/Generated/reins_core.swift does not match the UniFFI bindings just generated. Commit the output of ios/scripts/build-core.sh."
              exit 1
            fi
          fi
          lipo -info "$lib/libreins_core.a" | grep -q arm64
      # main's Swift compilation cache, module cache and packages (ios.yml saves them; the paths must be ios.yml's
      # exactly, or the cache does not match). Restore only.
      - uses: actions/cache/restore@v5
        with:
          path: |
            derived/ModuleCache.noindex
            derived/CompilationCache.noindex
            spm
            compilation-cache
          key: ios-swift-v1-${{ runner.os }}-${{ hashFiles('ios/Reins.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'ios/**/*.swift', 'ios/**/*.m', 'ios/**/*.h') }}
          restore-keys: |
            ios-swift-v1-${{ runner.os }}-
      - name: Build for testing
        env:
          MODE: build
        run: bash ios/scripts/ci-xcode-test.sh
      # ReinsTests: what ios.yml's unit shard runs (scripts/ios-ui-plan.py shard --name unit).
      - name: ReinsTests
        env:
          MODE: test-without-building
          ONLY: ReinsTests
          SKIP: ""
        run: bash ios/scripts/ci-xcode-test.sh
      - name: Upload the test result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-tests-unit-xcresult
          path: results.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: fromJSON(needs.plan.outputs.keys)['ios']
        uses: actions/cache/save@v5
        with:
          path: rust-toolchain.toml
          key: ${{ fromJSON(needs.plan.outputs.keys)['ios'] }}-ios

  # The one check to require: it passes when no job failed or was cancelled. A suite the plan did not select, or that
  # already passed on the same inputs, is skipped and counts as passed.
  result:
    name: CI result
    needs: [plan, admit, checks, rust, rust-clippy, replay, desktop-linux, linux-packages, desktop-macos, desktop-windows, android-native, android-release-smoke, android, ios]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Result
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.plan.result != 'success' }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c 'import json, sys; [print(k.ljust(22), v["result"]) for k, v in json.load(sys.stdin).items()]'
          test "$FAILED" = false
