name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  changes:
    name: Changed components
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      android: ${{ steps.paths.outputs.android }}
      docker: ${{ steps.paths.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select build lanes
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          rust=false android=false docker=false
          if [[ "$EVENT" == workflow_dispatch || -z "$BASE_SHA" || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            rust=true android=true docker=true
          else
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/*) rust=true android=true docker=true ;;
                Cargo.*|rust-toolchain.toml|crates/reins-core/*|crates/reins-proto/*|crates/reins-policy/*)
                  rust=true android=true ;;
                rustfmt.toml|build.rs|src/*|macros/*|crates/*|migrations/*|tests/*) rust=true ;;
                android/*) android=true ;;
                scripts/*) rust=true android=true ;;
                docker/*|Dockerfile|.dockerignore|.hadolint.yaml) docker=true ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" HEAD)
          fi
          { echo "rust=$rust"; echo "android=$android"; echo "docker=$docker"; } >> "$GITHUB_OUTPUT"

  checks:
    name: Format, docs, scripts and workflow checks
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - uses: crate-ci/typos@v1.50.1
      - run: python3 scripts/check-branding.py
      - run: python3 scripts/test-android-release.py
      - run: python3 scripts/test-ci-release-gate.py
      - run: python3 scripts/check-doc-links.py
      - run: python3 scripts/test-ci-routing.py
      - name: Conflict markers and shell syntax
        run: |
          status=0
          git grep -n -I -E '^(<<<<<<<|>>>>>>>)( |$)|^=======$' -- . ':(exclude)*.patch' ':(exclude)*.diff' || status=$?
          [[ "$status" == 1 ]] || { echo "::error::Conflict marker check failed"; exit 1; }
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(git ls-files -z 'scripts/*.sh' 'scripts/package/*.sh')
          scripts/test-next-version.sh
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - uses: zizmorcore/zizmor-action@v0.6.4
        with:
          inputs: ./.github/
          advanced-security: false
      - name: Docker templates
        if: needs.changes.outputs.docker == 'true'
        working-directory: docker
        run: |
          make
          git diff --exit-code
      - uses: hadolint/hadolint-action@v3.5.0
        if: needs.changes.outputs.docker == 'true'
        with:
          dockerfile: docker/Dockerfile.debian
      - uses: hadolint/hadolint-action@v3.5.0
        if: needs.changes.outputs.docker == 'true'
        with:
          dockerfile: docker/Dockerfile.alpine
      - name: Docker build checks
        if: needs.changes.outputs.docker == 'true'
        run: |
          docker build --check . -f docker/Dockerfile.debian
          docker build --check . -f docker/Dockerfile.alpine

  rust:
    name: Server and core tests (Nextest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-server-core
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.146
      # Cargo builds the normal server binary for tests/reins_server (CARGO_BIN_EXE_vaultwarden).
      # Nextest compiles all targets before starting E2E tests, so a separate server build is redundant.
      - name: Run all Rust tests
        env:
          REINS_TEST_SERVER_BINARY: ${{ github.workspace }}/target/debug/vaultwarden
        run: cargo nextest run --locked --workspace --exclude reins-desktop-app --features sqlite --no-fail-fast --test-threads 8
      # Nextest does not run doctests; retain Cargo's separate documentation test pass.
      - name: Documentation tests
        run: cargo test --locked --workspace --exclude reins-desktop-app --features sqlite --doc

  rust-clippy:
    name: Server and core Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-server-core-clippy
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      # Preserve the existing lint coverage: all core targets and the production server target.
      - run: cargo clippy --locked --workspace --exclude vaultwarden --exclude reins-desktop-app --all-targets -- -D warnings
      - run: cargo clippy --locked --features sqlite -- -D warnings

  desktop-linux:
    name: Desktop UI on Linux (clippy + tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-desktop-ui
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: GUI libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev \
            libx11-xcb-dev libfontconfig1-dev libfreetype-dev libvulkan-dev pkg-config
      - run: cargo clippy --locked -p reins-desktop-app --all-targets -- -D warnings
      - run: cargo test --locked -p reins-desktop-app

  desktop-macos:
    name: Desktop app on macOS (clippy + tests)
    # The release builds the desktop app for macOS too (release.yml); this keeps it compiling and its tests passing.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo clippy --locked -p reins-desktop --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast -p reins-desktop

  desktop-windows:
    name: Desktop app on Windows (clippy + tests)
    # The release builds the desktop app for Windows too (release.yml); this keeps it compiling and its tests passing,
    # and runs the background service for real (tests/windows_service.rs writes this runner's HKCU Run key).
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      REINS_TEST_WINDOWS_SERVICE: "1"
    steps:
      # Git on the Windows runners checks text files out with CRLF; the tests expect the files as committed.
      - name: Check out without CRLF
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustup target add aarch64-pc-windows-msvc && rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo clippy --locked -p reins-desktop --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast -p reins-desktop
      # scripts/install.ps1 as `irm | iex` runs it, in Windows PowerShell 5.1, from a release made here of the test
      # build: install, then install over it, then the user PATH has it.
      - name: Install script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Join-Path $env:RUNNER_TEMP 'release'
          $name = 'reins-desktop-0.0.0-x86_64-pc-windows-msvc'
          New-Item -ItemType Directory -Force -Path "$rel\$name" | Out-Null
          Copy-Item target\debug\reins.exe "$rel\$name\"
          Compress-Archive -Path "$rel\$name" -DestinationPath "$rel\$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$rel\$name.zip").Hash.ToLowerInvariant()
          Set-Content -Path "$rel\SHA256SUMS" -Value "$hash  $name.zip"
          $env:REINS_RELEASE_DIR = $rel
          $env:REINS_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'Reins'
          Get-Content scripts\install.ps1 -Raw | Invoke-Expression
          Get-Content scripts\install.ps1 -Raw | Invoke-Expression
          & "$env:REINS_INSTALL_DIR\reins.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'the installed reins.exe does not run' }
          $userPath = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (($userPath -split ';') -notcontains $env:REINS_INSTALL_DIR) { throw "not on the user PATH: $userPath" }
          Set-Content -Path "$rel\SHA256SUMS" -Value "$('0' * 64)  $name.zip"
          $failed = $false
          try { Get-Content scripts\install.ps1 -Raw | Invoke-Expression } catch { $failed = $_.ToString() -match 'checksum' }
          if (-not $failed) { throw 'a download that does not match SHA256SUMS was installed' }
      # The release builds Windows on Arm on this runner, without running it, and leaves it out when it fails; this
      # shows early whether it compiles, without failing CI (and so holding releases back) when it does not.
      - name: Check aarch64-pc-windows-msvc
        continue-on-error: true
        run: cargo check --locked -p reins-desktop --bin reins --target aarch64-pc-windows-msvc

  android:
    name: Android unit tests + debug APK
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Rust toolchain and Android targets
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
          rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-4.1.2
      - name: Install cargo-ndk
        run: cargo ndk --version || cargo install --locked cargo-ndk@4.1.2
      # The NDK version is the one app/build.gradle.kts pins (reinsNdkVersion); the build looks it up by path.
      - name: Install Android NDK
        run: |
          ndk="$(grep -oP 'reinsNdkVersion = "\K[^"]+' android/app/build.gradle.kts)"
          echo "NDK ${ndk}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ndk}" > /dev/null
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # No google-services.json in CI: the build skips the Firebase plugin (hasFirebase) and still assembles.
      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew --no-daemon --parallel :app:testFullDebugUnitTest :app:testPlayDebugUnitTest :app:assembleFullDebug -Preins.rustProfile=debug
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
