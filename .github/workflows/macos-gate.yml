name: macOS gate

# macOS admission (scripts/ci/admit.py; docs/reference/ci.md, "Admission"). The account runs five macOS jobs at once
# (GitHub-hosted, the free tier of this public repository), shared by CI, the iOS runs, the agents' iOS jobs and
# releases. Every macOS job in ci.yml, ios.yml, ios-core.yml and ios-job.yml needs this job, which waits until macOS
# runners are free for all the jobs it gates:
#   - releases come first: a release run whose "macOS builds" job does not exist yet holds a runner, and its queued
#     jobs ("macOS builds", "TestFlight upload") are busy runners like any other;
#   - main's CI passes at once (`wait: false`): that commit's release waits for CI's result;
#   - then pull requests labelled ci:lock, then ci:priority, then everyone else, first come, first served;
#   - background runs (ios.yml on main and at night) go last, only when nobody else waits, and leave a runner free.
# The request is in this job's name ("admit [macos=2] #232"), where every other gate reads it: nothing is written
# anywhere, so a pull request from a fork (read-only token) takes part. release.yml never uses this gate.
#
# It never waits more than `minutes` (180), and goes on after five API errors in a row or when the API rate limit is
# out for more than ten minutes: admission never blocks CI. scripts/test-ci-admit.py tests the script.
on:
  workflow_call:
    inputs:
      wait:
        description: Wait for runners (false passes at once; ci.yml on a push to main, which its release waits for)
        type: boolean
        default: true
      macos:
        description: The macOS jobs this gate lets go
        type: number
        default: 1
      background:
        description: Background work (ios.yml on main and at night) that waits for everyone else
        type: boolean
        default: false
      pr:
        description: The pull request this run tests (ci:priority, ci:lock)
        type: string
        default: ""
      minutes:
        description: The longest wait, in minutes
        type: number
        default: 180

permissions: {}

jobs:
  gate:
    name: "admit [macos=${{ inputs.macos }}${{ !inputs.wait && ' front' || inputs.background && ' bg' || '' }}]${{ inputs.pr != '' && format(' #{0}', inputs.pr) || '' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      actions: read # the runs and their jobs
      contents: read # scripts/ci
      pull-requests: read # ci:priority and ci:lock, and the heads of the pull requests that claim them
      issues: read # when ci:lock was added
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Wait for macOS runners
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_MACOS: ${{ inputs.macos }}
          CI_CLASS: ${{ !inputs.wait && 'front' || inputs.background && 'bg' || 'normal' }}
          CI_PR: ${{ inputs.pr }}
          CI_MACOS_LABELS: ${{ vars.IOS_RUNNER || 'xcode-27' }}
          CI_BUDGET_MACOS: ${{ vars.CI_BUDGET_MACOS }}
          CI_ADMISSION: ${{ vars.CI_ADMISSION }}
          CI_DEBOUNCE_SECONDS: ${{ vars.CI_DEBOUNCE_SECONDS }}
          CI_LOCK_HOURS: ${{ vars.CI_LOCK_HOURS }}
          MAX_WAIT_MINUTES: ${{ inputs.minutes }}
        run: python3 -I scripts/ci/admit.py
