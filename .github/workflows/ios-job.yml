name: iOS job

# Build and test jobs for agents that write Swift on Linux: scripts/ios-job.sh dispatches this for the current pushed
# branch, waits, and downloads the artifact (summary, logs, xcresult summaries, snapshot PNGs). See docs/ios-dev.md.
#
# One macOS job: the prebuilt core (ios-core.yml publishes it once per content hash), one build-for-testing seeded with
# main's Swift compilation cache, one simulator, then test-without-building per requested slice
# (ios/scripts/ios-job-run.sh). Nothing here gates a merge or a release; it is a tool, not a check.
#
# The runner is `vars.IOS_RUNNER` (default xcode-27, GitHub's free macOS image with Xcode 27 on this public repository)
# and the Xcode `vars.IOS_DEVELOPER_DIR`, so another macOS runner (a self-hosted Mac, a third-party label) is one
# repository variable away.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to build (default: the branch's head)"
        default: ""
        type: string
      run:
        description: "Comma-separated: build | snapshots[:Screen] | unit[:Class[/method]] | ui:Class[/method]"
        default: snapshots
        type: string
      device:
        description: Simulator device type
        default: iPhone 17 Pro
        type: string
      id:
        description: "A tag for finding this run (scripts/ios-job.sh sets one)"
        default: ""
        type: string

run-name: "iOS job: ${{ inputs.run || 'snapshots' }} on ${{ github.ref_name }} ${{ inputs.id }}"

permissions:
  contents: read

# One branch's jobs do not pile up: asking again for the same slices on the same branch cancels the older run.
# Different slices, or other branches, run side by side (up to the account's five macOS jobs).
concurrency:
  group: ios-job-${{ github.ref }}-${{ inputs.run || 'snapshots' }}-${{ inputs.device || 'default' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  core:
    name: Core
    uses: ./.github/workflows/ios-core.yml # zizmor: ignore[self-repository] the same commit's core workflow
    # For ios-core.yml's publish job, which runs only for main's own commit; on any other ref it is skipped and the
    # core is built for this run only.
    permissions:
      contents: write # upload a missing core to the ios-core-cache prerelease
      id-token: write # attest it
      attestations: write
    with:
      ref: ${{ inputs.ref }}
      platforms: iphonesimulator

  run:
    name: "iOS job: ${{ inputs.run || 'snapshots' }}"
    needs: core
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.IOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read # core-cache.sh verifies the prebuilt core's provenance
    env:
      DEVELOPER_DIR: ${{ vars.IOS_DEVELOPER_DIR || '/Applications/Xcode_27.0.app/Contents/Developer' }}
      RUN: ${{ inputs.run || 'snapshots' }}
      DEVICE: ${{ inputs.device || 'iPhone 17 Pro' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          version="$(xcodebuild -version | sed -n 's/^Xcode //p')"
          echo "Xcode $version, $(uname -m), $(sysctl -n hw.ncpu) cores, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Prebuilt core
        id: prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          if ios/scripts/core-cache.sh fetch iphonesimulator; then hit=true; else hit=false; fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
          echo "core fetch: $hit in $(( $(date +%s) - start )) s"
      # Built by this run's core job (a core not published yet, or a branch's own core).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.prebuilt.outputs.hit != 'true'
        continue-on-error: true
        with:
          name: ios-core-iphonesimulator
          path: ${{ runner.temp }}/core
      - name: Core from this run
        if: steps.prebuilt.outputs.hit != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in "$RUNNER_TEMP"/core/core-*.tar.gz; do ios/scripts/core-cache.sh install iphonesimulator "$archive"; done
      # The Swift compilation cache, module cache and packages that ios.yml saves from main (same paths, same build
      # settings), so every module the branch did not change is a cache hit. Restore only: a job writes no cache. A
      # branch's own DerivedData is not kept: after a fresh checkout Xcode recompiles every file of it anyway (new
      # mtimes), and its incremental state splits the compile jobs differently from main's, so the cache then misses
      # (measured: 660 s with it restored against 426 s with main's cache alone).
      # The path list must be ios.yml's exactly, or the cache does not match.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: swift
        with:
          path: |
            derived/ModuleCache.noindex
            derived/CompilationCache.noindex
            spm
            compilation-cache
          key: ios-swift-v1-${{ runner.os }}-${{ hashFiles('ios/Reins.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'ios/**/*.swift', 'ios/**/*.m', 'ios/**/*.h') }}
          restore-keys: |
            ios-swift-v1-${{ runner.os }}-
      - name: Build and test
        id: job
        env:
          SWIFT: ${{ steps.swift.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          echo "main Swift cache: ${SWIFT:-none}"
          du -sh derived compilation-cache spm 2>/dev/null || true
          status=0
          ios/scripts/ios-job-run.sh --out "$RUNNER_TEMP/ios-job" --run "$RUN" --device "$DEVICE" \
            --derived "$GITHUB_WORKSPACE/derived" --cas "$GITHUB_WORKSPACE/compilation-cache" \
            --packages "$GITHUB_WORKSPACE/spm" || status=$?
          {
            echo '```'
            cat "$RUNNER_TEMP/ios-job/summary.txt" 2>/dev/null || echo "no summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && !cancelled()
        with:
          name: ios-job
          path: ${{ runner.temp }}/ios-job
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7
