name: iOS job

# Build and test jobs for agents that write Swift on Linux: scripts/ios-job.sh dispatches this for the current pushed
# branch, waits, and downloads the artifact (summary, logs, xcresult summaries, snapshot PNGs). See docs/ios-dev.md.
#
# One macOS job: the prebuilt core (ios-core.yml publishes it once per content hash), one build-for-testing with the
# DerivedData folder restored from an Actions cache, one simulator, then test-without-building per requested slice
# (ios/scripts/ios-job-run.sh). Nothing here gates a merge or a release; it is a tool, not a check.
#
# The runner is `vars.IOS_RUNNER` (default xcode-27, GitHub's free macOS image with Xcode 27 on this public repository)
# and the Xcode `vars.IOS_DEVELOPER_DIR`, so another macOS runner (a self-hosted Mac, a third-party label) is one
# repository variable away.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to build (default: the branch's head)"
        default: ""
        type: string
      run:
        description: "Comma-separated: build | snapshots[:Screen] | unit[:Class[/method]] | ui:Class[/method]"
        default: snapshots
        type: string
      device:
        description: Simulator device type
        default: iPhone 17 Pro
        type: string
      id:
        description: "A tag for finding this run (scripts/ios-job.sh sets one)"
        default: ""
        type: string

run-name: "iOS job: ${{ inputs.run || 'snapshots' }} on ${{ github.ref_name }} ${{ inputs.id }}"

permissions:
  contents: read

# One branch's jobs do not pile up: asking again for the same slices on the same branch cancels the older run.
# Different slices, or other branches, run side by side (up to the account's five macOS jobs).
concurrency:
  group: ios-job-${{ github.ref }}-${{ inputs.run || 'snapshots' }}-${{ inputs.device || 'default' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  core:
    name: Core
    uses: ./.github/workflows/ios-core.yml # zizmor: ignore[self-repository] the same commit's core workflow
    permissions:
      contents: write # ios-core.yml's publish job uploads a missing core to the ios-core-cache prerelease
    with:
      ref: ${{ inputs.ref }}
      platforms: iphonesimulator

  run:
    name: "iOS job: ${{ inputs.run || 'snapshots' }}"
    needs: core
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.IOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write # prune this branch's older DerivedData caches
    env:
      DEVELOPER_DIR: ${{ vars.IOS_DEVELOPER_DIR || '/Applications/Xcode_27.0.app/Contents/Developer' }}
      RUN: ${{ inputs.run || 'snapshots' }}
      DEVICE: ${{ inputs.device || 'iPhone 17 Pro' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          version="$(xcodebuild -version | sed -n 's/^Xcode //p')"
          echo "Xcode $version, $(uname -m), $(sysctl -n hw.ncpu) cores, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Prebuilt core
        id: prebuilt
        run: |
          set -euo pipefail
          start=$(date +%s)
          if ios/scripts/core-cache.sh fetch iphonesimulator; then hit=true; else hit=false; fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
          echo "core fetch: $hit in $(( $(date +%s) - start )) s"
      # Published by the core job of this run when the release upload failed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.prebuilt.outputs.hit != 'true'
        continue-on-error: true
        with:
          name: ios-core-iphonesimulator
          path: ${{ runner.temp }}/core
      - name: Core from this run
        if: steps.prebuilt.outputs.hit != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in "$RUNNER_TEMP"/core/core-*.tar.gz; do ios/scripts/core-cache.sh install iphonesimulator "$archive"; done
      # DerivedData (with the Swift compilation cache and the packages): this branch's last, else main's. Keyed by the
      # Xcode version and the project and package pins, which change what every file compiles against.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: derived
        with:
          path: derived
          key: ios-job-dd-v1-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/Reins.xcodeproj/project.pbxproj', 'ios/Reins.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ios-job-dd-v1-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/Reins.xcodeproj/project.pbxproj', 'ios/Reins.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.ref_name }}-
            ios-job-dd-v1-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/Reins.xcodeproj/project.pbxproj', 'ios/Reins.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
      - name: Build and test
        id: job
        run: |
          set -euo pipefail
          du -sh derived 2>/dev/null || echo "no DerivedData restored"
          status=0
          ios/scripts/ios-job-run.sh --out "$RUNNER_TEMP/ios-job" --run "$RUN" --device "$DEVICE" \
            --derived "$GITHUB_WORKSPACE/derived" || status=$?
          echo "built=$([[ -n "$(find derived/Build/Products -maxdepth 1 -name '*.xctestrun' -print -quit 2>/dev/null)" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo '```'
            cat "$RUNNER_TEMP/ios-job/summary.txt" 2>/dev/null || echo "no summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && !cancelled()
        with:
          name: ios-job
          path: ${{ runner.temp }}/ios-job
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7
      - name: Trim DerivedData for the cache
        if: always() && !cancelled() && steps.job.outputs.built == 'true'
        run: |
          set -euo pipefail
          # Logs, result bundles and the index are not build state.
          rm -rf derived/Logs derived/Index.noindex derived/TextIndex
          du -sh derived
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: always() && !cancelled() && steps.job.outputs.built == 'true'
        with:
          path: derived
          key: ${{ steps.derived.outputs.cache-primary-key }}
      # One DerivedData cache per branch: older ones of this branch go, so jobs on many branches do not push main's
      # caches out of the repository's 10 GB.
      - name: Prune this branch's older DerivedData caches
        if: always() && !cancelled() && steps.job.outputs.built == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ steps.derived.outputs.cache-primary-key }}
          PREFIX: ios-job-dd-v1-
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh cache list --key "$PREFIX" --ref "refs/heads/$BRANCH" --limit 100 --json key --jq '.[].key' |
            while IFS= read -r key; do
              [[ "$key" == "$KEEP" ]] && continue
              gh cache delete "$key" && echo "deleted $key"
            done
