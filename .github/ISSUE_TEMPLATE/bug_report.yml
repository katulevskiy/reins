name: Bug report
description: Something in Reins did not work, including on a beta build
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: report privately (`SECURITY.md`), not here. Never paste secrets, tokens, passwords or recovery codes.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone or iPad
        - Android
        - Desktop
        - Server
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: beta-build
    attributes:
      label: Build
      options:
        - TestFlight
        - Google Play testing
        - Android Full build
        - Other pre-release
        - Public release
        - Not sure
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → Version, or `reins --version`.
      placeholder: "0.1.0 (7)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: "iPhone 15, iOS 18.2"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      placeholder: The approval never showed up on the phone.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
      placeholder: The phone should have asked me to approve.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Blocker stops a release.
      options:
        - Blocker
        - Major
        - Minor
        - Cosmetic
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots or recording
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove secrets first.
      render: text
    validations:
      required: false
