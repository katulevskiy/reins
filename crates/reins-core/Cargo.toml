[package]
name = "reins-core"
version = "0.1.0"
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "reins_core"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]
# Fakes for Autopilot (a model runtime, a tiny tokenizer, a package) used by the end-to-end tests.
testing = []

[dependencies]
reins-proto = { path = "../reins-proto" }
reins-policy = { path = "../reins-policy" }
aes = "0.8.4"
argon2 = "0.6.0"
async-trait = "0.1.92"
cbc = { version = "0.1.2", features = ["alloc"] }
data-encoding = "2.11.1"
encoding_rs = "0.8.42"
futures = "0.3.34"
grammers-client = { version = "0.10.0", default-features = false }
grammers-mtsender = "0.10.0"
grammers-session = { version = "0.10.0", default-features = false, features = ["serde"] }
log = "0.4.34"
mail-parser = "0.11.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "query", "http2", "charset", "multipart"] }
ring = "0.17.14"
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
uniffi = "0.32.2"
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }
webpki-roots = "1.0.9"
zeroize = "1.9.0"
# Autopilot's tokenizer: pure Rust (no oniguruma, no esaxx C++), so the core still cross-compiles for Android.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
crypto_box = { version = "0.9.1", features = ["seal", "std"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "rsa", "p256", "p384"] }
signature = "2.2.0"
rsa = { version = "0.9.10", default-features = false, features = ["std", "sha2"] }
# Payments: a store's registrable domain (the public suffix list, compiled in), to compare stores and checkouts.
psl = "2.1.241"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[lints]
workspace = true
