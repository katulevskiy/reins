[package]
name = "reins-replay"
version = "0.1.0"
description = "Replays recorded Reins requests through the consequence engine and a policy: ask rate, real-risk recall, what changed."
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
# Apache-2.0 (LICENSE at the repository root). See LICENSING.md.
license = "Apache-2.0"
publish.workspace = true

[[bin]]
name = "reins-replay"
path = "src/main.rs"

[dependencies]
reins-policy = { path = "../reins-policy" }
reins-proto = { path = "../reins-proto" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true
