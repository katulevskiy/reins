[package]
name = "reins-executor"
version = "0.1.0"
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
# Apache-2.0 (LICENSE at the repository root). See LICENSING.md.
license = "Apache-2.0"
publish.workspace = true

[[bin]]
name = "reins-executor"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
data-encoding = "2.11.1"
log = "0.4.34"
reins-audit = { path = "../reins-audit" }
reins-policy = { path = "../reins-policy" }
reins-proto = { path = "../reins-proto" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "query"] }
ring = "0.17.14"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "0.8.23"
webpki-roots = "1.0.9"
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[lints]
workspace = true
