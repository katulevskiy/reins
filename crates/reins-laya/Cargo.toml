[package]
name = "reins-laya"
version = "0.1.0"
description = "Autopilot's model on the desktop: an ONNX Runtime ModelRuntime and the laya-try tool. Never linked into the phone core."
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
# Meant to be Apache-2.0 (LICENSING.md), but it links reins-core (AGPL-3.0-only) for the tokenizer, the sequence and
# the decision rules, so it stays AGPL-3.0-only until those move into an Apache-2.0 crate.
license.workspace = true
publish.workspace = true

[[bin]]
name = "laya-try"
path = "src/bin/laya-try.rs"

[[bin]]
name = "laya-context"
path = "src/bin/laya-context.rs"

[dependencies]
reins-core = { path = "../reins-core" }
# ONNX Runtime with its prebuilt library (desktop only).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls", "api-24"] }
serde_json = "1.0.151"

[dev-dependencies]
reins-core = { path = "../reins-core", features = ["testing"] }
tempfile = "3.27.0"

[lints]
workspace = true
