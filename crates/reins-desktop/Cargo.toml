[package]
name = "reins-desktop"
version = "0.1.0"
description = "Reins desktop app: brings your connections to any AI harness. First part: a local git proxy that asks before an agent reads or pushes."
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
# Apache-2.0 (LICENSE at the repository root). See LICENSING.md.
license = "Apache-2.0"
publish.workspace = true

[lib]
name = "reins_desktop"
path = "src/lib.rs"

[[bin]]
name = "reins"
path = "src/main.rs"

[dependencies]
reins-proto = { path = "../reins-proto" }
async-trait = "0.1.92"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
crypto_box = { version = "0.9.1", features = ["seal", "std"] }
data-encoding = "2.11.1"
flate2 = "1.1.10"
futures-util = "0.3.34"
hostname = "0.4.2"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
log = "0.4.34"
ring = "0.17.14"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "stream", "http2", "query"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10.7"
sha2 = "0.10.9"
similar = { version = "2.7.0", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "fs", "process", "signal", "time", "sync"] }
toml = "0.8.23"
url = "2.5.8"
webpki-roots = "1.0.9"
zeroize = "1.9.0"
qrcode = { version = "0.14.1", default-features = false }

# The user id, signals and the non-dumpable flag. Windows has none of these; see src/win.rs for what it does instead.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
# No reins-core / reins-e2e here, even for tests: they are AGPL-3.0 and this crate is Apache-2.0. The test that
# runs the daemon against the real server and phone core is crates/reins-e2e/tests/desktop_phone.rs.
wiremock = "0.6.5"
tokio = { version = "1.53.1", features = ["test-util"] }

[lints]
workspace = true
