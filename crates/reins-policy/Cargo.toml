[package]
name = "reins-policy"
version = "0.1.0"
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
# Apache-2.0 (LICENSE at the repository root). See LICENSING.md.
license = "Apache-2.0"
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
# Org rules' `outside_hours` windows in the org's own time zone (DST-aware).
chrono-tz = "0.10.4"
data-encoding = "2.11.1"
reins-proto = { path = "../reins-proto" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
toml = "0.8.23"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
