# cargo-deny policy (https://github.com/EmbarkStudios/cargo-deny): `cargo deny --workspace check licenses bans`
# (`--workspace`: the root package is the server, and without it only the server's graph is checked).
#
# The server (the root crate `vaultwarden` and its `macros`) is AGPL-3.0-only; every other crate is Apache-2.0
# (LICENSING.md). Third-party dependencies must be under a permissive license (or MPL-2.0, whose copyleft is per file),
# so that every crate can be shipped under its own license. The `bans` section keeps the split honest: no Apache-2.0
# crate may use the server's code.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The workspace's own crates are not published; their licenses are set per crate (Cargo.toml) and explained in
# LICENSING.md.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
# The server's macros are AGPL-3.0-only: only the server may depend on them. (cargo-deny cannot ban the root crate
# `vaultwarden` itself; keep it out of the Apache-2.0 crates' manifests by review. rewarden-e2e runs the server as a
# separate program and does not link it.)
deny = [
    { crate = "macros", wrappers = ["vaultwarden"], reason = "AGPL-3.0-only (the server's macros)" },
]
