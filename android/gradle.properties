org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The official site: the default of the in-app update feed (-Preins.updateUrl overrides the feed). Changing the
# domain is this line here; the Rust side has reins_proto::official_site!.
reins.site=https://reins2fa.com
# The hosted server the sign-in screen is filled in with (a self-hosted build: -Preins.defaultServer=https://...);
# the Rust side has reins_proto::default_server!.
reins.defaultServer=https://app.reins2fa.com
