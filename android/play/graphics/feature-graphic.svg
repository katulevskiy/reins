<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <!-- Google Play's feature graphic (1024 x 500). The launcher icon's violet, the app's dark palette
       (design/Palette.kt) and its Geist faces (app/src/main/assets/fonts). render.sh turns it into a PNG. -->
  <style>
    @font-face { font-family: "Geist"; font-weight: 400; src: url("../../app/src/main/assets/fonts/Geist.ttf"); }
    @font-face { font-family: "Geist"; font-weight: 500; src: url("../../app/src/main/assets/fonts/Geist-Medium.ttf"); }
    @font-face { font-family: "Geist"; font-weight: 600; src: url("../../app/src/main/assets/fonts/Geist-SemiBold.ttf"); }
    @font-face { font-family: "Geist Mono"; font-weight: 500; src: url("../../app/src/main/assets/fonts/GeistMono-Medium.ttf"); }
    text { font-family: "Geist", sans-serif; }
    .mono { font-family: "Geist Mono", monospace; }
  </style>
  <defs>
    <radialGradient id="glow" cx="790" cy="250" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B2A8C" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#1F1150" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#170B33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#170B33"/>
      <stop offset="1" stop-color="#0C0620"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#base)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- The mark and the name -->
  <g transform="translate(72 112) scale(4)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12,3l7.5,3v5.5c0,4.6 -3.1,8.4 -7.5,9.5 -4.4,-1.1 -7.5,-4.9 -7.5,-9.5V6z" stroke="#C9C1FB" stroke-width="1.5"/>
    <path d="M8.7,12l2.4,2.4 4.2,-4.6" stroke="#FFFFFF" stroke-width="1.7"/>
  </g>
  <text x="78" y="282" font-size="76" font-weight="600" fill="#FFFFFF" letter-spacing="-1.5">Reins</text>
  <text x="80" y="332" font-size="29" font-weight="400" fill="#C9C1FB">Your AI asks. You decide.</text>
  <text x="80" y="372" font-size="20" font-weight="400" fill="#A9A9AE">Approvals on your phone. Your keys stay there.</text>

  <!-- An approval, as the phone shows it -->
  <g filter="url(#shadow)">
    <rect x="566" y="84" width="390" height="332" rx="28" fill="#111113" stroke="#2A2A30" stroke-width="1.5"/>
  </g>
  <g transform="translate(598 118)">
    <circle cx="14" cy="14" r="14" fill="#FB923C" fill-opacity="0.16"/>
    <path d="M7,14l14,-6 -5,14 -2.5,-5.5z" fill="none" stroke="#FB923C" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="40" y="12" font-size="15" font-weight="500" fill="#A9A9AE">Claude</text>
    <text x="40" y="32" font-size="19" font-weight="600" fill="#E8E8EA">Send an email</text>
    <text x="326" y="12" font-size="14" font-weight="500" fill="#6B6B72" text-anchor="end" class="mono">0:34</text>

    <rect x="0" y="54" width="326" height="1" fill="#1E1E22"/>
    <text x="0" y="84" font-size="14" fill="#6B6B72">To</text>
    <text x="64" y="84" font-size="15" fill="#E8E8EA">ann@corp.example</text>
    <text x="0" y="112" font-size="14" fill="#6B6B72">Subject</text>
    <text x="64" y="112" font-size="15" fill="#E8E8EA">Q3 report</text>
    <text x="0" y="146" font-size="15" fill="#A9A9AE">Hi Ann, attached is the Q3 report</text>
    <text x="0" y="168" font-size="15" fill="#A9A9AE">as discussed.</text>
    <rect x="0" y="188" width="326" height="1" fill="#1E1E22"/>

    <rect x="0" y="212" width="155" height="50" rx="25" fill="#E8E8EA" fill-opacity="0.075"/>
    <text x="77.5" y="243" font-size="17" font-weight="600" fill="#E8E8EA" text-anchor="middle">Deny</text>
    <rect x="171" y="212" width="155" height="50" rx="25" fill="#8B7CF6"/>
    <text x="248.5" y="243" font-size="17" font-weight="600" fill="#0C0620" text-anchor="middle">Approve</text>
  </g>
</svg>
