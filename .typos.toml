[files]
extend-exclude = [
    ".git/",
    "playwright/",
    "*.js", # Ignore all JavaScript files
    "!admin*.js", # Except our own JavaScript files
    # Rewarden test data: hash corpora, SSH keys and multilingual synthetic samples
    "android/app/src/test/resources/blobatar-gen2-hashes.tsv",
    "crates/rewarden-core/tests/fixtures/",
    # iOS: the blobatar hash corpus (as for Android) and Xcode's generated object ids
    "ios/ReinsTests/Fixtures/",
    "ios/Reins.xcodeproj/",
    "tools/laya/gen_data.py",
]
ignore-hidden = false

[default]
extend-ignore-re = [
    # We use this in place of the reserved type identifier at some places
    "typ",
    # In SMTP it's called HELO, so ignore it
    "(?i)helo_name",
    "Server name sent during.+HELO",
    # COSE Is short for CBOR Object Signing and Encryption, ignore these specific items
    "COSEKey",
    "COSEAlgorithm",
    # Ignore this specific string as it's valid
    "Ensure they are valid OTPs",
    # This word is misspelled upstream
    # https://github.com/bitwarden/server/blob/dff9f1cf538198819911cf2c20f8cda3307701c5/src/Notifications/HubHelpers.cs#L86
    # https://github.com/bitwarden/clients/blob/9612a4ac45063e372a6fbe87eb253c7cb3c588fb/libs/common/src/auth/services/anonymous-hub.service.ts#L45
    "AuthRequestResponseRecieved",
    # Ignore Punycode/IDN tests
    "xn--.+",
    # Rewarden: plurals of acronyms (NDKs, PNGs)
    "\\b[A-Z]{2,}s\\b",
    # Rewarden test data: hex key ids, base64 file contents, fake tokens and escaped non-ASCII text
    "\\b[0-9A-F]{16}\\b",
    "\"content\": \"[A-Za-z0-9+/=\\\\n]+\"",
    "5ecret",
    # Windows: the format switch of whoami (`/fo csv`)
    "/fo\\b",
    "caf\\\\u\\{e9\\}",
]

[default.extend-words]
# The grammers Telegram client crates
grammers = "grammers"
# Platt scaling accumulators (h_aa, h_ab, h_bb)
haa = "haa"
# Deliberately misspelled or truncated test inputs
pasword = "pasword"
tru = "tru"
abd = "abd"
# Entry of a common-passwords list
tigger = "tigger"
# iOS: Core Audio sound files (.caf) and simulator device ids (UDID)
caf = "caf"
udid = "udid"
