[package]
name = "reins-ads"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
fframes = { version = "=1.2.0", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.2.0", features = ["vulkan"] }
fframes_native_player = { version = "=1.2.0", default-features = false, features = ["vulkan", "audio"] }

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.2.0", features = ["h264", "libav-agree-gpl"] }

[lib]
name = "reins_ads"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "reins-ads"
path = "src/main.rs"

# Not part of the Reins Cargo workspace: the ads build on their own.
[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
